name: Desktop CI

on:
  push:
    branches: [main, 'fix/v4.3.2-rounded-frame-toolbar']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.3.2-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.3.2 — 圆角投屏与隐藏式悬浮控制条（Windows）

          根据真实投屏截图修复上一版的三个问题：

          - **四角不再露出方形画面**：使用 Windows 原生 SetWindowRgn 把真正的 scrcpy SDL 视频窗口裁剪成与外框开口匹配的圆角，而不仅仅是在上方绘制圆角线。
          - **鼠标移到边框自动出现工具条**：按住四方向箭头可以拖动整台手机，另外支持一键最小化与关闭；移开鼠标后工具条自动隐藏。原有 Ctrl+Alt+Shift+W 和 Ctrl+Alt+Shift+C 仍可用。
          - **去掉外缘白线**：调暗 SVG 的金属高光及内侧轮廓，修复浅色桌面上明显的白色细线。
          - **保留实时触控与性能**：中间仍是 scrcpy 原生视频，装饰层继续鼠标穿透；仅小型独立控制条接收操作，不会重编码画面。
          - **横屏兼容**：横屏/最小化/最大化时取消圆角裁剪并隐藏竖屏外框，不影响正常投屏。

          **使用方法**：启动竖屏镜像，将鼠标移到手机右边框、左边框或顶部边缘，按住浮出的移动箭头拖动，松开结束；横线最小化，叉号关闭。最小化后可从 Windows 任务栏或 Alt+Tab 恢复。

          **下载**：Windows 64 位 EXE/MSI；这是 Windows 桌面控制端，并非 Android APK。

          **仍需验证**：CI 检查编译与逻辑，不会模拟真实 Windows 桌面拖动和多 DPI 下的全部视觉情况。请使用你的安卓手机实测 100% / 125% / 150% 系统缩放与四角、白线、悬浮控件。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.3.2 · Rounded Frame & Controls Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
