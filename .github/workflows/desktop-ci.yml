name: Desktop CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish Windows GitHub Release
    needs: [checks, windows]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated Windows installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: wireless-v4.1.0-preview.1
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installer found in the artifact"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI 无线连接优化预览版（Windows）

          从 kil0bit-kb/scrcpy-gui v4.1.0 Fork 后的二次开发版本。

          - 新增 **USB 一键转无线**：检测 USB 已授权设备，获取手机的 Wi-Fi IPv4 地址，启用 `adb tcpip 5555` 并自动连接。
          - 改进 Android 11+ 无线调试：尝试根据 mDNS 服务找回变化后的 TLS 连接端口，区分配对端口。
          - 修复 mDNS 发现列表的两列或三列、空格分隔格式兼容问题。
          - 记住实际成功连接的无线端口，并增加回归测试。

          **下载：** 选择下方 Assets 内的 Windows `.exe` 或 `.msi` 安装包。

          注意：这是 **Windows 桌面应用安装包，不是 Android APK**。USB 转无线要求已通过 USB 调试授权、手机开启 Wi-Fi，并能从电脑访问其局域网 IP。虽然已经通过自动化测试，连接功能仍需要在实际手机上验证。仅建议在可信网络中开启 ADB TCP/IP 调试。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.1.0 · Wireless Preview 1 (Windows)" \
            --notes-file release-notes.md \
            --prerelease \
            --latest=false
