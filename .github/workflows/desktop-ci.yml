name: Desktop CI

on:
  push:
    branches: [main, 'fix/v4.3.4-rounded-mask-overscan']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.3.4-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.3.4 — 修复手机外框四角突出黑块

          根据真实 Windows 实测截图，修复 v4.3.3 的四角黑色矩形块，同时避免恢复 v4.3.2 的蓝色接缝。

          - **删除矩形遮片**：移除 v4.3.3 用来盖蓝线的不透明黑色矩形。这个遮片超出了手机金属外壳的圆弧轮廓，导致四角突出的黑块。
          - **真实视频圆角预留余量**：对 scrcpy 原生 SDL 窗口恢复 Windows 圆角剪裁，但把 GDI 裁剪半径比 SVG 可见屏幕的圆角半径缩小 3 物理像素。真实画面延伸到黑钛外框内部，被 SVG 平滑边缘自然覆盖，不会直接露出硬裁剪线。
          - **调整内沿压边**：保留窄幅 7 单位 SVG 深色圆角细线，降低 DPI 下的白线/蓝线风险；不扩大手机金属边框整体尺寸。
          - **保留悬停控制条**：靠近手机边缘显示拖动、最小化、关闭按钮，保持鼠标穿透和低延迟实时控制。
          - **横屏兼容**：横屏、最小化和最大化时恢复普通 SDL 窗口，竖屏再套用外框。

          **下载安装**：Windows 64 位优先选择 EXE，另外提供 MSI。退出旧版本及所有投屏窗口后安装。此程序不是 Android APK。

          **预览与人工测试**：自动化通过只能保证代码、像素几何和 Windows 安装包可编译。请用原来蓝色桌面壁纸检查四角是否自然、边缘是否还有蓝白漏光，并测试鼠标拖动/最小化/关闭。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.3.4 · Corrected Rounded Corners Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
