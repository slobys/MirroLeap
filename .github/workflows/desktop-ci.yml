name: MirroLeap Desktop CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libdbus-1-dev
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: python3 scripts/check_annotations.py
      - run: python3 scripts/check_landscape_toolbar.py
      - run: python3 scripts/check_portable_release.py
      - run: python3 scripts/check_compact_home.py
      - run: python3 scripts/check_security_baseline.py
      - run: python3 scripts/check_annotated_capture.py
      - run: python3 scripts/check_preview_clipboard.py
      - run: python3 scripts/check_wireless_center.py
      - run: python3 scripts/check_app_update.py
      - run: python3 scripts/check_video_decoder.py
      - run: python3 scripts/check_mirropresent.py
      - run: python3 scripts/check_v5_integration.py
      # HQ is experimental and opt-in: validate decoded-frame data safety
      # without starting Android or replacing the official scrcpy binary.
      - run: python3 scripts/check_hq_bridge.py
      - name: Experimental C HQ sink packed-frame tests (Linux API stubs only)
        run: |
          gcc -std=c11 -D_WIN32 -Wall -Wextra -Werror \
            -Ihq/tests/stubs -Ihq/include hq/tests/test_sink.c -o /tmp/mirroleap-hq-sink-test
          /tmp/mirroleap-hq-sink-test /tmp/mirroleap-hq-c-fixture.bin
      - run: python3 scripts/check_repository_migration.py
      - name: Rust tests including C-to-Rust HQ frame fixture
        env:
          MIRROLEAP_HQ_C_FIXTURE: /tmp/mirroleap-hq-c-fixture.bin
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Real Edge dashboard geometry (idle, running and core-missing)
        run: node scripts/windows-dashboard-layout.mjs
      - name: Real Edge settings geometry (100%, 125%, 150% DPI)
        run: node scripts/windows-settings-layout.mjs
      - name: Real Edge phone quick-controls (8 layouts, 3 DPI scales)
        run: node scripts/windows-phone-controls-layout.mjs
      - name: Real Edge phone metal frame anti-alias (all corners, 3 DPI scales)
        run: node scripts/windows-phone-frame-visual.mjs
      - name: Build original standalone desktop executable (unpatched, without any installer)
        run: npm run tauri build -- --no-bundle
      # Linux CI excludes Windows-only Magnification.dll code. Run its
      # geometry, wheel bounds and source-centering tests on Windows too.
      - name: Windows native MirroCreator magnifier wheel tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_live_lens::tests
      - name: Windows native MirroCreator click ripple pixel tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_click_effect::tests
      - name: Windows HQ decoded-frame shared-memory owner and protocol tests
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_protocol::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_bridge_windows::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_geometry::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_reference_render::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_pipeline::tests
      - name: Stage extract-and-run portable version
        shell: pwsh
        run: ./scripts/windows-stage-portable.ps1
      # Regression gate for v4.6.3: compiler/build tests passed even while
      # the installed Windows app showed an entirely blank UI. Boot the
      # actual WebView2 executable and read the rendered React DOM via CDP.
      - name: Windows WebView2 packaged homepage startup smoke
        shell: pwsh
        run: ./scripts/windows-smoke-webview.ps1
      - name: Build Windows NSIS and MSI installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Optional Authenticode signing and mandatory SHA256 verification
        shell: pwsh
        env:
          SCRCPY_SIGNING_PFX_BASE64: ${{ secrets.SCRCPY_SIGNING_PFX_BASE64 }}
          SCRCPY_SIGNING_PFX_PASSWORD: ${{ secrets.SCRCPY_SIGNING_PFX_PASSWORD }}
        run: ./scripts/windows-sign-and-checksum.ps1
      - name: Re-sign updater after optional Authenticode signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/windows-sign-updater.ps1
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "Portrait SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/device-frame/iphone-black-landscape.svg")) {
            throw "Landscape SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/frame.html")) {
            throw "The annotation canvas is missing from the Windows build"
          }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path "src-tauri/target/release/bundle/portable/MirroLeap_${version}_x64_Portable.zip")) {
            throw "The no-installer portable ZIP is missing"
          }
          if (-not (Test-Path "src-tauri/target/release/bundle/nsis/MirroLeap_${version}_x64-setup.exe")) {
            throw "MirroLeap branded NSIS installer is missing"
          }
          if (-not (Test-Path "src-tauri/target/release/bundle/msi/MirroLeap_${version}_x64_en-US.msi")) {
            throw "MirroLeap branded MSI installer is missing"
          }
          if (-not (Test-Path "release-checksums/SHA256SUMS.txt")) {
            throw "No signed-and-hashed release manifest"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MirroLeap-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/portable/*_x64_Portable.zip
            release-checksums/SHA256SUMS.txt

  verify-updater:
    name: Validate cryptographically signed Windows updater
    needs: [checks, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: MirroLeap-Windows-Installer
          path: release-assets
      - name: Verify final installer bytes, pinned-key signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir verified-assets
          for suffix in "_x64-setup.exe" "_x64_en-US.msi" "_x64_Portable.zip"; do
            file="$(find release-assets -type f -name "MirroLeap_${VERSION}${suffix}" -print -quit)"
            test -n "$file" || { echo "Missing installer: ${suffix}"; exit 1; }
            cp "$file" verified-assets/
          done
          file="$(find release-assets -type f -name "SHA256SUMS.txt" -print -quit)"
          test -n "$file" || { echo "Missing checksum manifest"; exit 1; }
          cp "$file" verified-assets/
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)
          file="$(find release-assets -type f -name "MirroLeap_${VERSION}_x64-setup.exe.sig" -print -quit)"
          test -n "$file" || { echo "Missing signed updater signature"; exit 1; }
          cp "$file" verified-assets/
          node scripts/write-updater-manifest.mjs "$VERSION" \
            "verified-assets/MirroLeap_${VERSION}_x64-setup.exe" \
            "verified-assets/MirroLeap_${VERSION}_x64-setup.exe.sig" verified-assets/latest.json
          node -e 'const m=require("./verified-assets/latest.json"); if (!m.platforms?.["windows-x86_64"]?.signature) process.exit(1)'

  publish-release:
    name: Publish stable MirroLeap release
    needs: [checks, windows, verify-updater]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Windows packages
        uses: actions/download-artifact@v4
        with:
          name: MirroLeap-Windows-Installer
          path: release-assets
      - name: Publish GitHub Release (not just a tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          mapfile -d '' packages < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*_x64_Portable.zip' \) -print0)
          if (( ${#packages[@]} != 3 )); then
            echo "Expected branded NSIS EXE, MSI and Portable ZIP; got ${#packages[@]}"; exit 1
          fi
          mkdir -p verified-assets
          cp "${packages[@]}" verified-assets/
          manifest="$(find release-assets -type f -name SHA256SUMS.txt -print -quit)"
          test -n "$manifest" || { echo "Missing checksum manifest"; exit 1; }
          cp "$manifest" verified-assets/SHA256SUMS.txt
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)
          updater_sig="$(find release-assets -type f -name "MirroLeap_${VERSION}_x64-setup.exe.sig" -print -quit)"
          test -n "$updater_sig" || { echo "Missing signed NSIS updater artifact"; exit 1; }
          cp "$updater_sig" verified-assets/
          test -s "verified-assets/MirroLeap_${VERSION}_x64-setup.exe.sig"
          node scripts/write-updater-manifest.mjs "$VERSION" \
            "verified-assets/MirroLeap_${VERSION}_x64-setup.exe" \
            "verified-assets/MirroLeap_${VERSION}_x64-setup.exe.sig" verified-assets/latest.json
          for suffix in "_x64-setup.exe" "_x64_en-US.msi" "_x64_Portable.zip"; do
            test -f "verified-assets/MirroLeap_${VERSION}${suffix}" || {
              echo "Missing MirroLeap_${VERSION}${suffix}"; exit 1;
            }
          done
          cat > release-notes.md <<'NOTES'
          ## MirroLeap — 轻盈投屏，专注当下

          基于 kil0bit-kb/scrcpy-gui 二次开发，使用 Genymobile/scrcpy 投屏核心。

          ### 主要更新
          ### v5.0.12 正式稳定版 · 多阶段功能整合
          - **正式发布**：整合 v5.0.3–v5.0.11 全部测试修复至 main，本版作为 GitHub Latest 正式版。既有旧版本和配置均保留。
          - **实时置顶已优化**：悬浮栏「置顶 / 已置顶」可原生切换 Windows 窗口层级，scrcpy 视频、透明真机边框及工具栏共同保持正确 Z 序；连续切换不再重启投屏。用户已对相关功能进行实机验收。
          - **画面旋转与演示**：Android 真正的横竖屏方向请求，投屏内容与手机边框/静态放大镜方向对齐；聚光灯、定格放大镜、画笔和一键清除均由悬浮栏操作。Android 应用或 ROM 可能拒绝强制旋转。
          - **无线与性能**：USB/Wi-Fi 配对与故障诊断、窗口恢复、截图及画笔合成 PNG 保存、GPU 解码兼容回退、场景预设和精简首页。
          - **安全更新体验**：检测到新版本时启动弹窗提醒且右上角版本号显示绿色点；「稍后」只关闭当次弹窗，不丢失提醒。仅在用户确认后下载、验签并安装 NSIS；MSI/Portable 由用户手动更新。
          - **Windows 安装包**：提供 NSIS EXE、MSI、免安装 ZIP、SHA256SUMS.txt、NSIS minisign 签名及 latest.json，全部来自本次成功构建。暂无可信 Windows Authenticode CA 代码签名；SmartScreen 仍可能提示，请勿关闭安全防护。
          - **验收说明**：GitHub Actions 覆盖 Rust/TypeScript 测试、真实 WebView2 启动及签名校验；不同手机 ROM 的旋转和未来跨版本更新弹窗效果仍需要使用场景验证。

          ### v5.0.8 实机方向旋转、自动更新弹窗与外链
          - **手机内容与边框一致旋转**：改用 scrcpy 原生 MOD+R 请求 Android 横竖屏切换，只有确认 SDL 视频长宽方向变化才报告成功；锁定方向时明确提示。
          - **放大镜方向同步**：Android 截图、视频和 WebView2 朝向暂时不一致时有限等待重试，失败仍恢复触控，不持久保存截图。
          - **行为设置布局**：手机与连接、录制与保存恢复同一行双列，窄窗口垂直排列，不留大面积空白。
          - **启动更新提醒**：应用打开时后台只检查一次版本，发现新版才展示可关闭弹窗；用户确认后才使用固定公钥验签 NSIS 更新，便携版/MSI 经默认浏览器官方手动升级。
          - **社区链接可用性**：YouTube @naiyou、Telegram @naiyous 以及官方 Release 附件使用受控 Rust OS 默认浏览器白名单，不提供任意 URL/程序执行权限。

          ### v5.0.7 原生窗口稳定性与单通道签名在线更新
          - **GPU 解码兼容回退修复**：D3D11/音频回退后新 scrcpy PID 重新启动真实手机边框和悬浮栏；旧跟随器自动退出，避免“解码切换后无边框”。
          - **Windows 窗口置顶兼容路径**：Win32 动态置顶不可用时，通过带停止确认的 scrcpy 原生参数重启实现置顶；重启异常保留恢复逻辑。
          - **行为设置去重**：隐藏重复真机边框、移除无边框；记住窗口位置移动到九宫格实时开关并写回现有设置。
          - **首页频道入口**：YouTube @naiyou 和 Telegram @naiyous 以醒目双图标融入精简主页，响应式不遮挡设备操作。
          - **最新发布检测与签名安装**：单次查询官方最新完整正式/预发布版；NSIS EXE 用户可主动下载安装已校验 minisign 的最新版；ZIP/MSI 安全手动升级；撤销 WebView2 直接 updater/install 权限。

          ### v5.0.6 悬浮栏演示与控制优化
          - **MirroPresent 悬浮面板**：直接使用手机投屏右侧悬浮栏启用聚光灯、定格放大镜、刷新静态快照和退出演示，并与画笔/快捷键模式互斥。
          - **鼠标滚轮缩放**：两种演示圆圈可在手机画面内通过滚轮调整尺寸；放大镜还支持 Ctrl+滚轮调倍率，范围有上限下限。
          - **圆角遮罩修复**：演示画布与黑钛 SVG 开孔使用一致的横竖屏裁切，避免深色透明罩向四角溢出。
          - **快捷键与设置去重**：移除重复的息屏快捷操作，保留电源键；移除与悬浮栏重复的启动全屏/关闭手机屏幕设置，并保护旧配置迁移。
          - **原生修复**：旋转改为投屏画面 Alt+右方向键；窗口置顶先保留目标状态再同步 Win32 视频、外框、工具栏并复核。
          - **保护与验证**：快照失败后自动恢复触控；新增 24 组悬浮演示工具的浏览器几何检查和交互回归测试。Windows 真机效果仍需复测。

          ### v5.0.5 实机稳定性与更新通道优化
          - **四角遮罩**：调整横竖屏 SVG 开孔与 native GDI 圆角，改善屏幕画面露出边框的问题。
          - **拖动同步**：启用 Win32 DeferWindowPos 视频/边框/工具栏批量平移，暂停旧跟随器在拖动期间的重复定位，降低快速拖动时卡顿。
          - **快捷操作**：置顶验证并维护三个原生窗口层级；全屏、旋转、粘贴采用焦点确认的 SDL 键盘扫描码；息屏走固定 Android KEYCODE_SLEEP。
          - **状态反馈**：快捷九宫格显示发送中、已发送及失败提示，不再把指令送达当成 Android 已完成结果。
          - **更新检查**：正式版与测试版分别查询固定 GitHub API，测试版仅手动下载，签名一键更新仍限正式 NSIS 安装版。

          ### v5.0.4 实机反馈修复
          - **拖动边框跟随**：视频、透明手机外框、悬浮栏在同一个 12ms 原生移动循环中同步位移，修复拖动时明显分离。
          - **四个快捷键重做**：全屏、旋转、粘贴、息屏转为向当前 scrcpy SDL 窗口定向投递 Alt 组合键，不再依赖悬浮 WebView 的输入焦点；此行为需 Windows/Android 实机继续确认。
          - **窗口置顶移到悬浮栏**：九宫格新增「置顶」实时切换并显示当前状态；高级设置分类改为「行为设置」，去掉重复的置顶开关。
          - **窄屏防遮挡**：新增九按钮 3×3 布局的 24 组浏览器/缩放回归检查。

          ### v5.0.3 手机悬浮栏快捷控制与签名在线更新
          - **悬浮快捷控制**：手机投屏旁展开八个实时操作，支持主页、返回、最近任务、电源，以及全屏、旋转、粘贴、息屏；原生窗口与设备权限严格绑定，按键仅作用于当前投屏。
          - **签名在线更新**：Windows NSIS EXE 安装版可主动下载安装 minisign 签名验证的官方更新包；不支持无签名包，免安装 ZIP/MSI 仍需手动升级以避免重复安装。
          - **发布完整性**：额外上传官方签名文件及 latest.json；更新只通过单一官方 HTTPS Release 入口，不允许自动绕过 SmartScreen。
          ### v5.0.2 全新设置中心 UI
          - **投屏参数不再局促**：宽屏左右并排显示捕获/画质设置与 GPU 解码、当前参数概览；窄窗口自动切回单列且保留滚动。
          - **行为设置重新分组**：设备与连接、窗口与显示、录制保存各自独立；开关更大且支持键盘操作，快捷键独立可视网格。
          - **外观与引擎清晰分离**：主题、模式、语言与缩放统一为设置卡片，scrcpy 状态/路径独立；软件更新、开源归属集中到右侧。
          - **工具页减少长文说明**：演示与截图按钮优先，安全说明使用可展开区域；日志单独作为工具卡片，并保留原有权限与隐私边界。
          - **全链路回归**：增加 UI 交互测试，Windows Edge 跨 100/125/150% DPI 与六种视口做 18 组真实布局验证，保留 WebView2 原生启动及三种安装包哈希校验。

          ### v5.0.1 舒适阅读与客户端界面更新
          - **提高设置可读性**：将过小的高级设置标签和提示统一提升至约 14–15px，增加按钮/输入框高度和卡片内边距；参数网格按窗口宽度从两列自适应为一列，允许纵向滚动，不挤在单屏。
          - **分组与导航更清晰**：输入增强独立分区，垂直同步与编码器兼容选项放入可展开区域；各设置分类的字体、导航间距和键盘焦点统一，保留此前所有低频专业功能。
          - **新增真实 Edge 设置页验收**：Windows CI 检查 100%、125%、150% DPI 和四种窗口尺寸下的文字、控件尺寸、操作入口与滚动可达性，并继续运行原有真实 WebView2 启动检测和三格式安装包校验。

          - **v4.7.3 MirroCapture 截图预览与剪贴板复制**：保存原始/画笔合成 PNG 后在「设置 → 工具与日志」显示缩略图，用户可主动点「复制图片到剪贴板」粘贴到 Windows 应用。没有新增首页按钮。
          - **最小权限和隐私保护**：读取预览只限电脑 Downloads 目录中本工具生成的截图文件，拒绝任意路径、符号链接越界与大于 12 MiB 的图片；主窗口仅具有系统剪贴板的图片写入权限，不读取任何用户现有剪贴板内容。切换手机会清除旧设备图片预览。超大图仍能正常保存但不在界面预览。
          - **v4.8.0 智能无线连接中心**：将连接、诊断、USB 转无线、配对结果汇总在无线设备页。点击连接后立即显示进度，失败时自动展示设备状态、当前连接端口和下一步建议。发现同 IP 的动态端口时可以手动选择，不擅自自动连接，也不扫描整个局域网。
          - **历史地址与授权状态更清楚**：展示历史设备的已连接/离线/等待授权/已记住状态，以及 mDNS 配对端口和连接端口的区别；配对成功不会谎报手机已建立投屏连接。
          - **更安全的 ADB 请求**：仅接受合法 IPv4 和可选端口、阻止重复手动连接；原生配对命令校验六位配对码、强制 20 秒超时并限定主窗口调用，同时保留原有的后台退避重连和连接后状态刷新。
          - **v4.8.1 应用内安全检查更新（第四阶段独立功能）**：在「设置 → 外观与引擎」提供手动检查 MirroLeap 正式版本，读取独立仓库 GitHub Latest 的 Release 信息；准确比较本机版本、新正式版与高于正式版的开发构建，展示发布说明及只允许当前仓库官方标签与确定文件名的下载链接。
          - **不自动执行安装器**：仅将经过校验的 Portable ZIP / EXE / MSI / SHA256SUMS 链接交给用户在浏览器手动打开；不上传用户设备、配置、日志或手机画面。代码签名尚未配置，因此不启动自动安装、不请求提权，也不关闭 SmartScreen。
          - **网络和输入保护**：检查只在用户点击时发起；固定 HTTPS GitHub API 地址、禁止跳转、5 秒连接超时与 12 秒总超时、最多读取 512 KiB 元数据，拒绝测试版/草稿、恶意标签或跨仓库下载地址；离线、限流、异常版本都有独立错误提示。
          - **v4.9.0 GPU 视频解码与性能诊断（第五阶段正式集成）**：设置 → 投屏参数新增主机 GPU 解码能力检测，使用本机 scrcpy --version / --help 判断是否真正支持 scrcpy 5.x 的 --hwdec。按平台提供自动、纯软件和显式 GPU 解码（Windows D3D11VA）；默认不新增启动参数以保留旧核心兼容。
          - **安全回退与可验证反馈**：只在用户强制 GPU 模式且出现明确硬件解码失败日志时自动重试一次 scrcpy 默认解码，不因普通 ADB 掉线频繁重启；日志单独展示每台设备实际报告的解码方式。可按需开启 --print-fps 真实帧率日志，配置于下次投屏才生效，旧版不发送不支持的参数。
          - **兼容性边界**：命令支持并不代表特定 GPU 驱动可用，硬件加速是否降低 CPU/延迟需要实机测量；scrcpy 5.0.1 修复过 Windows H.265 硬解问题，遇到 v5.0.0 会给出升级核心建议，但不会自动升级或修改其安装目录。
          - **v5.0.0 MirroPresent 专业演示模式（第六阶段正式集成）**：设置 → 工具与日志增加聚光灯、定格放大镜和居中演示窗口按钮。Windows 透明手机边框的演示图层只在用户开启时拦截手机指针，聚光灯实时跟随鼠标；定格放大镜使用一次 ADB 手机截图并在原生设备像素对齐后画圆形约 2.3 倍放大，**手动刷新，不是实时视频放大**。
          - **触控与方向安全**：演示聚光灯/放大镜与画笔触控互斥，离开演示恢复 Android 触控；原悬浮栏「一键恢复」也能退出演示。投屏关闭/页面重载/横竖屏变化自动清理演示状态与旧快照；快照仅在指定手机、主窗口调用并校验尺寸、比例、一次性 WebView ACK 和限时加载。
          - **截图边界说明**：MirroCapture 原始截图与画笔批注合成导出保持原行为，当前不会导出 MirroPresent 聚光灯遮罩/静态镜头；不截取电脑桌面、不上传手机画面，也不为了演示强制改动编码码率或核心。
          - **v4.7.2 窗口稳定性 3.0 第一阶段**：优化 Windows SDL 视频与透明手机外框、悬浮栏的 HWND 跟随，不再在位置/层级完全稳定时每 50ms 重复调用 SetWindowPos。发生拖动、旋转、任务栏/多屏 DPI、最小化恢复或层级异常时立即调整，另外每 2 秒进行一次轻量健康校验。保留原有画笔、窗口控制和视频功能，并增加纯 Rust 决策回归测试。
          - **六项路线图整合发布**：v5.0.0 统一交付窗口稳定性第一阶段、MirroCapture 预览复制、智能无线连接、桌面更新检查、GPU 解码诊断和 MirroPresent。五个草稿分支先在集成分支合并，再通过同一套 Linux/Windows 测试后发布，未进行 Windows 真机/Android 端到端性能承诺。
          - **v4.7.1 MirroCapture 批注图片导出**：在手机投屏画面完成画笔圈画后，到「设置 → 工具与日志」点击「保存含画笔截图」。截取当前选定 Android 手机的原始 PNG，并将当前手机的透明画笔图层按像素比例合成到原分辨率，生成单独的 MirroLeap-Annotated-*.png 文件，保留原始截图按钮。
          - **颜色、橡皮擦和方向防错**：来自同一窗口的透明 Canvas 快照支持原有画笔与 destination-out 橡皮擦效果；采用只接受匹配设备/一次性令牌的本地 IPC 回传。无画笔、投屏最小化、旋转不匹配、PNG 损坏或超时都会提示错误，不会偷偷保存错误的合成图。
          - **隐私保护**：只有用户点击保存时才截屏，不上传手机画面；不包含电脑桌面、手机边框或浮动工具条；保留现有下载目录独占创建与错误回滚。新增截图合成与画笔回调自动测试。
          - **v4.7.0 MirroCapture 本地手机截图**：在「设置 → 工具与日志」一键抓取当前选中 Android 手机的原始 PNG 到 Windows 下载文件夹；通过 ADB exec-out screencap -p 实现，不上传云端、不重启投屏，保存成功后显示完整路径。
          - **截图安全与稳定性**：设备标识校验，独立 20 秒命令超时、24MiB 上限，PNG 头部/IHDR/终止标识检查；独占创建防覆盖、无设备时禁用按钮、失败显式提示、运行中避免并发重复截图。原始 PNG **不含 MirroLeap 的画笔叠加标注**，后续单独开发批注合成与导出。
          - **v4.6.5 首页按钮与底部链接布局修复**：开始/停止投屏按钮完整收在投屏卡片内，不再盖住「更多功能与快捷键」。卡片根据内容自动确定最小高度，窗口缩小时通过整页滚动确保所有操作可达，默认窗口可直接完整看到按钮与链接。
          - **新增 32 组真实 Edge 视觉布局测试**：Windows CI 在默认/最小/最大/窄屏、投屏前/投屏中/引擎未安装/分辨率切换、100%/150% 缩放组合下，读取实际元素矩形并验证按钮与卡片、底部链接互不遮挡。新增测试与真实 WebView2 首页启动校验相互补充。
          - **v4.6.4 白屏恢复**：修复 v4.6.3 在部分 Windows WebView2 环境中安装后只显示空白背景的问题。暂时回退新增的全局 CSP 到此前可用版本的设置，保留其它 Tauri 权限隔离、日志与更新完整性保护。
          - **真实启动验收**：Windows CI 不再只检查 EXE 能否构建；打包程序会在 WebView2 中真实启动，并通过页面 DOM 检查确认 MirroLeap 首页、设备卡片和投屏控制已经渲染，防止空白版再次进入 Releases。
          - **故障提示**：即使前端 JS 启动异常，也有独立于 React 的初始提示，不再只显示毫无说明的空白窗口。严格 CSP 将在完成兼容性验证后重新引入。
          - **v4.6.3 稳定与安全**：修复 npm 依赖安全公告，自动测试增加依赖漏洞扫描；配置 Tauri CSP 并将主界面、悬浮控制栏和启动画面分权隔离。
          - **保护导出与高级终端**：只允许主窗口调用终端和报告导出，限制报告文件名/体积及终端执行时间；诊断报告按白名单保存非敏感设置并对常见设备地址做脱敏。
          - **一键场景预设**：均衡、演示、流畅、高清四个视频预设，运行中的投屏不会因切换预设而自动重启；其它设置不受影响。
          - **本地优先**：移除主界面加载 Google Fonts 的远程请求。依旧保留原有 USB/Wi-Fi、真机边框、画笔及完整高级设置。
          - **独立仓库**：项目已迁入 [slobys/MirroLeap](https://github.com/slobys/MirroLeap)，不再作为 GitHub fork 展示；完整保留原项目署名与开源授权。
          - **开发历史保留**：原先 slobys/scrcpy-gui 的 14 个分支、14 个标签和历史 Release 已迁移，新版本从本独立仓库发布。
          - **v4.6.1 悬浮栏防越界**：悬浮控制栏被约束在手机投屏画面的可见上下边缘之间，并避开当前 Windows 显示器任务栏；拖动、横屏与最小化恢复时持续重新计算。
          - 横屏高度有限时自动切换双排悬浮按钮，画笔展开采用紧凑布局；极端屏幕裁切场景下，WebView 内容与窗口同步缩放，避免功能按钮消失。
          - 软件、窗口、安装包与文档全面采用 MirroLeap 品牌。
          - 默认精简首页：设备列表、分辨率、声音、真机边框和开始/停止投屏。
          - 低频功能移入分类设置：摄像头、虚拟显示器、编码器、无线配对、录屏、快捷键、引擎路径和日志。
          - 保留无线投屏、横竖屏真机外框、画笔、一键恢复、窗口恢复等功能。

          ### Windows 下载
          - MirroLeap 的 Portable.zip：推荐，解压后双击 Run-MirroLeap.cmd。
          - MirroLeap 的 setup.exe：Windows NSIS 安装程序。
          - MirroLeap 的 .msi：Windows Installer 安装程序。
          - SHA256SUMS.txt：对应全部三个文件的 SHA-256 校验。

          免安装版不调用旧版 NSIS 卸载程序，适合旧版升级出现卸载错误的用户。尚未配置受信任 CA 代码签名证书，Windows SmartScreen 仍可能提示风险；不要关闭系统防护。原有内部应用标识和配置存储键保留用于兼容。发布为正常 Release 不代表完成了每种 Windows 设备的人工验收。
          NOTES
          gh release create "$RELEASE_TAG" verified-assets/* \
            --target "$GITHUB_SHA" \
            --title "MirroLeap v${VERSION} — Windows" \
            --notes-file release-notes.md --latest
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets \
            --jq '{draft:.isDraft,prerelease:.isPrerelease,files:[.assets[].name]}'
