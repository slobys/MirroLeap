name: Desktop CI

on:
  push:
    branches: [main, 'fix/v4.5.1-portable-upgrade']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: python3 scripts/check_annotations.py
      - run: python3 scripts/check_landscape_toolbar.py
      - run: python3 scripts/check_portable_release.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build original standalone desktop executable (unpatched, without any installer)
        run: npm run tauri build -- --no-bundle
      - name: Stage extract-and-run portable version
        shell: pwsh
        run: ./scripts/windows-stage-portable.ps1
      - name: Build Windows NSIS and MSI installers
        run: npm run tauri build
      - name: Optional Authenticode signing and mandatory SHA256 verification
        shell: pwsh
        env:
          SCRCPY_SIGNING_PFX_BASE64: ${{ secrets.SCRCPY_SIGNING_PFX_BASE64 }}
          SCRCPY_SIGNING_PFX_PASSWORD: ${{ secrets.SCRCPY_SIGNING_PFX_PASSWORD }}
        run: ./scripts/windows-sign-and-checksum.ps1
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "Portrait SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/device-frame/iphone-black-landscape.svg")) {
            throw "Landscape SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/frame.html")) {
            throw "The annotation canvas is missing from the Windows build"
          }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path "src-tauri/target/release/bundle/portable/ScrcpyGUI_${version}_x64_Portable.zip")) {
            throw "The no-installer portable ZIP is missing"
          }
          if (-not (Test-Path "release-checksums/SHA256SUMS.txt")) {
            throw "No signed-and-hashed release manifest"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/portable/*_x64_Portable.zip
            release-checksums/SHA256SUMS.txt

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.5.2-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*_x64_Portable.zip' \) -print0)
          if (( ${#installers[@]} != 3 )); then
            echo "Need NSIS EXE, MSI and no-installer portable ZIP; got ${#installers[@]}"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.5.2 — 简洁画笔面板与 Windows 悬浮栏恢复修复

          - 画笔工具改为与窗口按钮分开的紧凑面板，操作、颜色、笔触粗细一次全部展示，无需上下滚动。
          - 橡皮擦采用明确的图形图标，画笔、撤销、清空各有独立按钮；一键恢复仍可退出标注并恢复手机触控。
          - 工具面板根据真实 Windows 显示缩放及可用屏幕边距选择左/右展开或紧凑纵向停靠。
          - 最小化后重新显示投屏时，尝试恢复真机外框和悬浮栏；窗口层级保持与 scrcpy 视频关联，并短暂显示控制栏。
          - 新增画笔前端功能测试与 DPI/桌面边界布局回归测试。

          **本预览版已通过 GitHub Actions 自动构建，但仍需在真实 Windows 10/11 显示器上验证最小化恢复、窗口焦点和多屏 DPI。**

          Windows NSIS 升级旧版时可能显示：
          - NSIS Error: Error launching installer
          - Already Installed → Unable to uninstall!

          这通常意味着旧版卸载程序无法被启动，或卸载注册记录与当前安装文件不匹配；单纯重新编译安装包不能自动修复用户电脑里已经损坏的旧版卸载路径。Tauri NSIS 也有已知升级/卸载相关问题。

          **推荐下载：ScrcpyGUI_4.5.2_x64_Portable.zip（免安装版）**
          1. 在可信目录中完整解压，例如 D:\Apps\ScrcpyGUI-Portable。
          2. 双击 Run-ScrcpyGUI.cmd 或 scrcpy-gui-v3.exe。
          3. 它不调用旧版 NSIS 卸载程序，不依赖注册表的旧版安装记录，也不会覆盖旧版软件。
          4. 首次运行若提示找不到 scrcpy 核心，可在软件内下载，或将已有完整可信 scrcpy-bin 文件夹复制到该 exe 同级目录。
          5. 免安装版仍需要 Windows 10/11 x64 和系统 WebView2 Runtime。

          **标准安装：** 同时保留 EXE（NSIS）和 MSI。若 NSIS 检测到旧版、且卸载失败，可以在 Already Installed 页面选 Do not uninstall 尝试覆盖安装。若旧安装记录确实损坏，建议按微软官方“程序安装和卸载疑难解答”处理，不要手动清理注册表或关闭安全软件。

          **安全与完整性：** EXE、MSI、Portable ZIP 三种发布文件都写入 SHA256SUMS.txt，Release 上传前逐项重新校验。如果配置了 CA Authenticode 证书，会同时签名 Windows 安装包和 ZIP 内的独立 exe；尚未配置证书的预览版仍可能触发 SmartScreen 警告。

          **保留此前功能**：竖屏与横屏黑钛真机外框、无线连接、画笔一键恢复、自动切换投屏分辨率，以及独立 Windows 免安装运行。

          这是独立的 Windows 预览发布，未能直接在你的电脑上复现旧版卸载记录；用户侧的具体 NSIS 失败原因仍需通过安装日志或修复工具确认。
          NOTES
          # Verify the SHA256 checksums from the exact installers being released.
          manifest="$(find release-assets -type f -name SHA256SUMS.txt -print -quit)"
          if [[ -z "$manifest" ]]; then echo "Missing release checksum manifest"; exit 1; fi
          mkdir -p verified-assets
          cp "${installers[@]}" verified-assets/
          cp "$manifest" verified-assets/SHA256SUMS.txt
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" verified-assets/* \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.5.2 · Compact Ink Tools and Toolbar Restore Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
