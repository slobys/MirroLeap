name: Desktop CI

on:
  push:
    branches: [main, 'fix/v4.3.3-frame-seam']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.3.3-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.3.3 — 无蓝线真机圆角优化（Windows）

          根据用户实际截图，重点修复四角与手机边框之间的蓝色锯齿线，以及侧边 / 底部的细亮线。

          - **去掉 Windows GDI 的硬圆角剪裁**：原版 SetWindowRgn 使用整数像素裁剪，而独立 WebView2 SVG 圆角使用抗锯齿，叠加时会漏出 Windows 桌面的蓝色壁纸。本版保留完整的 scrcpy 原生视频窗口，避免背景穿透。
          - **增加 SVG 实体圆角遮片**：在屏幕透明开口外，将原生矩形视频的四个小角覆盖为深黑色，呈现平滑自然的圆角。
          - **密封屏幕边缘**：增加内侧极窄深色遮片，盖住不同 DPI 下 1–2 像素的亚像素缝隙，消除蓝线和白色亮边。
          - **减少高光**：将金属外框渐变压暗，保留窄边框与手机轮廓，避免过亮镶边。
          - **保留所有控制功能**：边缘悬停出现操作栏，支持按住拖动、最小化、关闭；原生触控、快捷键和低延迟投屏不受影响。
          - **仅 Windows 竖屏真机外框**：横屏、全屏及其他模式继续原生 scrcpy。

          升级方法：退出旧版与投屏窗口，下载安装下方 EXE 或 MSI，重新启动竖屏投屏。

          **预览版与实测说明**：CI 验证 Python SVG/Rust 静态约束、Rust 及前端测试、Windows 正式打包，不能代替你的 Windows 电脑上的真实 DPI 与视觉检测。请继续用蓝色或浅色桌面壁纸观察四角，必要时可关闭外框恢复普通 scrcpy。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.3.3 · Seamless Phone Frame Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
