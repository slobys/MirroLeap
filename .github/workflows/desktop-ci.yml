name: Desktop CI

on:
  push:
    branches: [main, 'feat/v4.3.1-slim-svg-frame']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.3.1-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.3.1 — 真机黑钛窄边框重设计（Windows）

          依据真实使用截图反馈，重做 v4.3.0 的 iPhone 风格外观。

          - **取消假刘海和灵动岛**：保持 Android 原生状态栏，顶部没有任何模拟 iOS 元素。
          - **更细的 iPhone 风格金属外框**：使用高精度 SVG 黑钛金属质感，外壳边距约为屏幕宽度的 1.9%，取代原先每侧约 4% 的厚边框。
          - **中央真实透明屏幕**：画面始终来自原生 scrcpy SDL 视频窗口，无图片替换，无重编码；Windows 装饰层鼠标穿透。
          - **更精确的定位**：SVG 开口尺寸和 Win32 原生像素计算严格一致；外框随画面移动和缩放自动更新。
          - **竖屏优先**：横屏时隐藏外框但继续正常投屏；手机转回竖屏时恢复装饰外框。
          - **可随时关闭**：行为设置中关闭“iPhone 风格·黑钛窄边框”，重新投屏即可恢复普通窗口。

          使用方式：选择 Android 设备，在 Windows 下启动「屏幕」镜像。按 Ctrl+Alt+Shift+W 移动投屏窗口，单击结束；Ctrl+Alt+Shift+C 居中。

          **下载**：Windows 64 位用户推荐 EXE 安装包，另提供 MSI。此项目仍然是 Windows 桌面程序，不是 Android APK。

          **预览版提醒**：自动化验证 SVG/Rust 几何、前端测试和 Windows 编译，不等于已在所有 DPI/显卡环境真机验证。请在 100%、125%、150% Windows 显示缩放下测试。若画面与边框错位，关闭外框不影响 scrcpy。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.3.1 · Slim Titanium Frame Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
