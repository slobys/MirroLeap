name: Desktop CI

on:
  push:
    branches: [main, 'fix/v4.4.1-stable-ink']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: python3 scripts/check_annotations.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/frame.html")) {
            throw "The annotation canvas is missing from the Windows build"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.4.1-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.4.1 — 修复画笔偶发不能绘制（Windows）

          针对 v4.4.0 真机使用反馈：画笔按钮有时能用，有时失效。

          - **画布真实状态确认**：改用 WebView2 JS 执行结果回调，先确认 Canvas 已加载且已进入画笔模式，才启用鼠标捕获。旧版仅向窗口投递 JS 就将按钮显示为开启，可能导致工具栏亮起但无法绘制。
          - **窗口前后层级修复**：点右侧工具栏后，即使工具栏处于前台，持续保持画笔透明窗口位于 scrcpy 实时画面之上，并让工具栏位于画笔层之上。
          - **防连点和状态同步**：画笔按钮切换期间暂时禁用，避免连续点击造成 Rust/JavaScript 状态不一致；窗口重新获得焦点时同步真实状态，不再凭本地变量猜测。
          - **自动恢复触控**：关闭标注时先恢复 scrcpy 鼠标穿透；如画布还没准备好或窗口加载中，明确提示错误而不会启用无效捕获。
          - **新交互回归测试**：增加画笔快速连点、加载失败、真实状态回读、重新获得焦点恢复等测试。
          - **原有功能完整保留**：四色画笔、画笔粗细、橡皮擦、撤销、清空、隐藏式拖动/最小化/关闭、一键自动切换分辨率和黑钛真机外框。

          **使用**：退出旧版本后安装 Windows x64 EXE（或 MSI），启动竖屏投屏，将鼠标移到手机右侧，点击画笔按钮，再直接在手机实时画面书写。关闭画笔后可恢复正常点击手机应用。

          **预览版提醒**：CI 会检查前端、Rust、窗口 API 和安装包，但用户电脑上的 WebView2 鼠标捕获与多 DPI 仍须实测。如果出现红色错误提示点，可悬停查看说明或根据弹窗提示重试。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.4.1 · Reliable Pen Hotfix Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
