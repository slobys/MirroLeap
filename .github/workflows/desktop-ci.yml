name: Desktop CI

on:
  push:
    branches: [main, 'feat/v4.5-immersive-controls']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: python3 scripts/check_annotations.py
      - run: python3 scripts/check_landscape_toolbar.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Optional Authenticode signing and mandatory SHA256 verification
        shell: pwsh
        env:
          SCRCPY_SIGNING_PFX_BASE64: ${{ secrets.SCRCPY_SIGNING_PFX_BASE64 }}
          SCRCPY_SIGNING_PFX_PASSWORD: ${{ secrets.SCRCPY_SIGNING_PFX_PASSWORD }}
        run: ./scripts/windows-sign-and-checksum.ps1
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "Portrait SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/device-frame/iphone-black-landscape.svg")) {
            throw "Landscape SVG is missing from Windows installation"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/frame.html")) {
            throw "The annotation canvas is missing from the Windows build"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-checksums/SHA256SUMS.txt

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.5.0-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.5.0 — 横屏真机外框、悬浮栏与一键恢复

          - **横屏外框**：手机打开横向全屏视频时，自动改用旋转后的黑钛金属外框（独立横向 SVG），保留 Android 实时画面、触控与长宽比例，无须停止投屏；转回竖屏自动恢复原外框。
          - **最小化再恢复**：恢复后重新确认 WebView2 外框和悬浮工具栏真实可见性，重新设置窗口位置和前后层级；鼠标移到机身边缘即可再次呼出悬浮栏。
          - **悬浮工具栏更易点**：从约 48 像素扩展至 62 像素物理宽度；「拖动」「最小化」「关闭」放在顶部相邻一组，画笔与其他工具单独分组。
          - **画笔一键恢复**：新按钮可一次清除当前全部标注，并立即退出画笔、恢复真实手机鼠标操作。原来的撤销、橡皮擦、颜色及分辨率自动切换保持可用。
          - **安装安全与可信度**：所有 EXE/MSI 发布 SHA256SUMS.txt 校验文件。CI 支持在配置受信任的 Authenticode PFX 代码签名证书后自动签名并验证；在未提供有效证书时安装包仍为未签名，会如实显示警告，不会绕过 Defender/SmartScreen。
          - **权限与说明**：说明如何使用合法可信代码签名与微软商店分发途径，不把 GitHub 发布者名称伪装为 Windows 可验证签名身份。

          Windows 64 位用户优先下载安装 EXE，也提供 MSI。退出旧版及投屏窗口后安装。安装后请验证 100%/125%/150% 显示缩放下的最小化恢复、横竖屏视频、悬浮栏和一键恢复。

          此版本仍是 Windows 预览版；自动化不能代替用户真实电脑上的鼠标/DPI/播放器全屏测试。
          NOTES
          # Verify the SHA256 checksums from the exact installers being released.
          manifest="$(find release-assets -type f -name SHA256SUMS.txt -print -quit)"
          if [[ -z "$manifest" ]]; then echo "Missing release checksum manifest"; exit 1; fi
          mkdir -p verified-assets
          cp "${installers[@]}" verified-assets/
          cp "$manifest" verified-assets/SHA256SUMS.txt
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" verified-assets/* \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.5.0 · Immersive Phone Controls Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
