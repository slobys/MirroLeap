name: Desktop CI

on:
  push:
    branches: [main, 'feat/v4.3-iphone-device-frame']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.3.0-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.3.0 — 真机外框投屏预览版（Windows）

          首个 Windows 真机外框版本。沿用稳定的 scrcpy 视频和控制引擎。

          - **实时真机外框**：深空灰 iPhone 风格金属边框、灵动岛造型、侧边硬件按键，直接包裹实时、可操控的 Android 投屏窗口，并非静态图片。
          - **保持原生低延迟**：只增加一个透明、可鼠标穿透的装饰窗口，不重编码、不截屏、不修改手机系统 UI。
          - **自动跟随**：与 scrcpy 窗口同步移动、尺寸改变和旋转，最小化/最大化时自动隐藏；投屏退出时关闭。
          - **设置开关**：Windows 默认启用，软件“行为设置”可关闭；非镜像、全屏和纯 OTG 模式自动禁用。
          - **兼容旧版**：保留 v4.2 的无线连接诊断、安全核心更新和 UI 缩放功能。

          **移动真机窗口：** Ctrl+Alt+Shift+W（点击结束拖动），Ctrl+Alt+Shift+C（居中）。
          **下载安装：** 选择下方 Assets 内的 Windows EXE 或 MSI。Android 视频由 scrcpy 实时绘制，外框本身不拦截触摸。
          **注意：** 此特性只在 Windows 下实现并通过构建检查，透明覆盖层的实际视觉与触控仍须在你的电脑上进行真机验证。不是 Android APK。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.3.0 · iPhone Frame Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
