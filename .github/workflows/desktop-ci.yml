name: Desktop CI

on:
  push:
    branches: [main, 'feat/v4.4-resolution-annotations']
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede previous development branch builds; do not cancel
# validated main-branch releases after a merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/check_device_frame.py
      - run: python3 scripts/check_annotations.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
      - name: Confirm phone SVG shipped with Tauri dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/device-frame/iphone-black-portrait.svg")) {
            throw "The phone frame SVG is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/phone-controls.html")) {
            throw "The hover toolbar is missing from the Windows installer frontend"
          }
          if (-not (Test-Path "dist/frame.html")) {
            throw "The annotation canvas is missing from the Windows build"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish validated Windows release
    needs: [checks, windows]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publish release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated installers
        uses: actions/download-artifact@v4
        with:
          name: ScrcpyGUI-Windows-Installer
          path: release-assets
      - name: Publish versioned preview
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: scrcpygui-v4.4.0-preview.${{ github.run_number }}
        run: |
          set -euo pipefail
          mapfile -d '' installers < <(find release-assets -type f \( -iname '*.exe' -o -iname '*.msi' \) -print0)
          if (( ${#installers[@]} == 0 )); then
            echo "No Windows installers found"; exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## ScrcpyGUI v4.4.0 — 一键分辨率切换 + 投屏画笔标注（Windows）

          - **一键应用分辨率**：在运行中的普通镜像会话里直接选 480p / 720p / 1080p / 2K / 4K / 原始分辨率。程序自动停止旧流，等待退出确认，再以新的 scrcpy --max-size 参数启动，不需再手工点击停止和启动。会短暂黑屏；不会执行 adb wm size，不会修改安卓系统自身分辨率。
          - **安全切换与恢复**：限制并发切换、保留窗口上次位置、录屏时禁止自动切换；新参数启动失败时尽力恢复旧配置。此版本不支持真正“不中断的编码分辨率切换”，该能力需修改 scrcpy 核心协议。
          - **新增隐藏式画笔**：手机右侧悬浮栏加入画笔按钮；开启后在实时画面上绘制、选择黄/红/白/青色、切换笔刷粗细、橡皮擦、撤销和清空；关闭后恢复原生触控。标注仅覆盖电脑上的投屏画面，**不会写入安卓系统**。
          - **标注随窗口缩放**：采用按画面比例记录的透明 canvas；调整投屏窗口大小时笔迹保持位置，断开投屏或自动切换分辨率后标注清空。
          - **保留真机外框**：维持黑钛窄边框、隐藏悬浮拖动/最小化/关闭以及之前的圆角修复。

          **使用方式**：Windows 下打开镜像，直接改分辨率选择框即可自动切换。把鼠标移到手机右边缘，点击新画笔按钮；退出画笔即可恢复点击手机应用。

          **预览版限制**：自动化检查可验证代码与安装包，但透明窗口的鼠标捕获、Windows 不同 DPI、短暂重启及各手机编码器兼容性仍需在真实 Windows 电脑上测试。此程序是桌面 GUI，不是 Android APK。
          NOTES
          gh release create "$RELEASE_TAG" "${installers[@]}" \
            --target "$GITHUB_SHA" \
            --title "ScrcpyGUI v4.4.0 · Quick Resolution & Pen Preview #${{ github.run_number }} (Windows)" \
            --notes-file release-notes.md --prerelease --latest=false
