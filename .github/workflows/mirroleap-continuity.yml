name: MirroLeap single-app signed prerelease and optional HQ core

on:
  push:
    branches:
      - feat/mirrocreator-hq-lens-235
      - feat/hq-scrcpy501-rawframe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirroleap-single-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-mirroleap:
    name: Verified MirroLeap legacy-updatable EXE/MSI and opt-in HQ module
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: All web and controller tests
        run: npm test
      - name: Frontend production build and HQ static guardrails
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Web frontend build failed" }
          python scripts/check_hq_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "HQ IPC check failed" }
          python scripts/check_hq_v5_bridge.py
          if ($LASTEXITCODE -ne 0) { throw "HQ v5 hardware-frame safety checks failed" }
          python scripts/check_app_update.py
          if ($LASTEXITCODE -ne 0) { throw "Update guard check failed" }
          python scripts/check_v5_integration.py
          if ($LASTEXITCODE -ne 0) { throw "Legacy lens regression check failed" }
      - name: Native Windows HQ and original live-lens unit tests
        shell: pwsh
        run: |
          $tests = @(
            'hq_protocol::tests','hq_bridge_windows::tests','hq_geometry::tests',
            'hq_reference_render::tests','hq_pipeline::tests',
            'hq_cpu_lens_windows::tests','native_live_lens::tests',
            'native_click_effect::tests','hq_runtime::tests',
            'app_update::tests::v523_can_discover_and_install_standard_signed_v528_without_rebranding'
          )
          foreach ($test in $tests) {
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib $test
            if ($LASTEXITCODE -ne 0) { throw "Windows Rust test failed: $test" }
          }
      - name: Clone EXACT reviewed scrcpy 5.0.1 upstream commit
        shell: pwsh
        run: |
          git clone --depth 1 --branch v5.0.1 https://github.com/Genymobile/scrcpy.git hq/upstream-src
          if ($LASTEXITCODE -ne 0) { throw "Upstream scrcpy clone failed" }
          $head = (git -C hq/upstream-src rev-parse HEAD).Trim()
          if ($head -ne 'a60891aea193d92e7e5c3942700eca63f9d19a5f') {
            throw "Unreviewed scrcpy upstream revision"
          }
          python hq/apply_scrcpy_v5.py hq/upstream-src
          if ($LASTEXITCODE -ne 0) { throw "Pinned HQ sink patch failed" }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-sdl3
      - name: Build pinned patched native scrcpy client, no Android server
        shell: msys2 {0}
        run: |
          meson setup hq/upstream-build hq/upstream-src \
            --buildtype=release -Dcompile_server=false \
            -Dcompile_app=true -Dusb=false -Dv4l2=false -Dportable=true
          meson compile -C hq/upstream-build
          ./hq/upstream-build/app/scrcpy.exe --version | grep -F 'MirroLeap HQ scrcpy5 raw-frame v3 (experimental)'
      - name: Download SHA256-pinned OFFICIAL scrcpy 5.0.1 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip'
          $archive = 'hq/scrcpy-win64-v5.0.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = 'b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5'
          if ($actual -ne $expected) { throw 'Official scrcpy runtime SHA256 mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath hq/original-win
          $root = (Get-ChildItem hq/original-win -Directory | Select-Object -First 1).FullName
          if (-not $root) { throw 'Official scrcpy archive directory missing' }
          $target = 'src-tauri/hq-preview-core/scrcpy-hq-bin'
          New-Item -ItemType Directory -Force $target | Out-Null
          # The verified official archive contains prebuilt SDL3 and FFmpeg libraries.
          # Those are ABI-incompatible with the patched UCRT64 build; copying
          # them AND UCRT64's replacements caused the 50-70 MB preview files.
          # Preserve only real ADB/server/runtime assets; resolve patched DLLs
          # from its own compiler environment in the following step.
          $required = @('adb.exe','scrcpy-server','AdbWinApi.dll','AdbWinUsbApi.dll')
          $optional = @('libusb-1.0.dll','scrcpy.png','disconnected.png')
          foreach ($file in @($required) + @($optional)) {
            $source = Join-Path $root $file
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $target $file)
            } elseif ($required -contains $file) {
              throw "Verified official scrcpy runtime missing mandatory $file"
            }
          }
          $compiled = 'hq/upstream-build/app/scrcpy.exe'
          if (-not (Test-Path $compiled)) { throw 'Patched client missing' }
          Copy-Item -LiteralPath $compiled -Destination (Join-Path $target 'scrcpy.exe') -Force
          Copy-Item -LiteralPath 'hq/upstream-src/LICENSE' -Destination (Join-Path $target 'LICENSE-scrcpy-Apache-2.0.txt')
          foreach ($file in @('scrcpy.exe','adb.exe','scrcpy-server')) {
            if (-not (Test-Path (Join-Path $target $file))) {
              throw "Preview core is missing $file"
            }
          }
          Write-Host 'Official scrcpy SHA256 validated; staged ONLY matched ADB/server and patched client.'
      - name: Bundle MATCHING MSYS2/UCRT64 FFmpeg and SDL runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          target=src-tauri/hq-preview-core/scrcpy-hq-bin
          test -f "$target/scrcpy.exe"
          # The patched client was linked against the MSYS2 UCRT64 ABI.
          # Official scrcpy 5.0.1's verified ZIP supplies adb/server/docs,
          # but may contain FFmpeg/SDL DLLs with DIFFERENT import versions.
          # Walk PE imports recursively and copy the exact UCRT64 build DLLs.
          declare -A seen=()
          declare -A needed_packages=()
          pending=("$target/scrcpy.exe")
          copied=0
          for ((i=0; i<${#pending[@]}; i++)); do
            binary="${pending[$i]}"
            while IFS= read -r dll; do
              [[ -n "$dll" ]] || continue
              key="${dll,,}"
              if [[ -v 'seen[$key]' ]]; then continue; fi
              seen[$key]=1
              match="$(find /ucrt64/bin -maxdepth 1 -type f -iname "$dll" -print -quit)"
              if [[ -n "$match" ]]; then
                cp -f "$match" "$target/"
                pending+=("$target/$(basename "$match")")
                copied=$((copied+1))
                package="$(pacman -Qoq "$match" 2>/dev/null || true)"
                if [[ -n "$package" ]]; then needed_packages["$package"]=1; fi
              elif [[ ! -f "$target/$dll" ]]; then
                # Allow only Windows' own DLLs or API-set forwarders.
                # Unknown third-party imports fail closed; the following
                # ordinary PowerShell launch proves the final runtime works.
                case "${key}" in
                  api-ms-win-*|ext-ms-*) ;;
                  *)
                    if [[ ! -f "/c/Windows/System32/$dll" && ! -f "/c/Windows/SysWOW64/$dll" ]]; then
                      echo "Non-system UCRT64 dependency missing: $dll"
                      exit 1
                    fi
                  ;;
                esac
              fi
            done < <(objdump -p "$binary" | sed -n 's/^[[:space:]]*DLL Name: //p')
          done
          if (( copied < 4 )); then
            echo "Not enough matched UCRT64 runtime DLL dependencies: $copied"
            exit 1
          fi
          # Preserve only the license files for packages whose DLLs are
          # ACTUALLY shipped, instead of the entire MSYS2 licenses tree.
          licenses="$target/msys2-thirdparty-licenses"
          mkdir -p "$licenses"
          for pkg in "${!needed_packages[@]}"; do
            while IFS= read -r file; do
              if [[ -f "$file" ]]; then
                relative="${file#/ucrt64/share/licenses/}"
                mkdir -p "$licenses/$(dirname "$relative")"
                cp "$file" "$licenses/$relative"
              fi
            done < <(pacman -Qlq "$pkg" | grep '^/ucrt64/share/licenses/' || true)
          done
          printf '%s\\n' "${!needed_packages[@]}" | sort > "$target/MSYS2-RUNTIME-PACKAGES.txt"
          printf 'Matched UCRT64 DLLs copied: %s; licenses restricted to %s required packages\\n' "$copied" "${#needed_packages[@]}"
          du -sh "$target"
      - name: Verify assembled HQ Windows binary runs OUTSIDE MSYS2 shell
        shell: pwsh
        run: |
          $target = 'src-tauri/hq-preview-core/scrcpy-hq-bin'
          $probe = & (Join-Path $target 'scrcpy.exe') --version 2>&1 | Out-String
          Write-Host "HQ --version exit code: $LASTEXITCODE"
          Write-Host "HQ preview marker present: $($probe.Contains('MirroLeap HQ scrcpy5 raw-frame v3 (experimental)'))"
          if ($LASTEXITCODE -ne 0 -or -not $probe.Contains('MirroLeap HQ scrcpy5 raw-frame v3 (experimental)')) {
            throw 'Assembled preview scrcpy client failed: verify bundled UCRT64 dependencies'
          }
          $adbProbe = & (Join-Path $target 'adb.exe') version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $adbProbe.Contains('Android Debug Bridge')) {
            throw 'The reduced HQ Preview lacks a working bundled ADB runtime'
          }
          $total = (Get-ChildItem -Path $target -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Verified slim patched scrcpy + adb; unpacked resources: $([math]::Round($total / 1MB, 2)) MiB"
          Write-Host 'The assembled pinned Windows HQ runtime passed its launch and identity check.'
      - name: Validate Windows native layered circle in a GUI desktop
        shell: pwsh
        env:
          MIRROLEAP_HQ_GDI_SMOKE: '1'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_cpu_lens_windows::tests
          if ($LASTEXITCODE -ne 0) { throw 'Native BGRA round-window smoke failed' }
      - name: Make separate opt-in HQ core ZIP with SHA256 PINNED INTO the small app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid MirroLeap version' }
          $tag = "v${version}"
          $coreDir = 'src-tauri/hq-preview-core/scrcpy-hq-bin'
          $archiveDir = 'hq-optional-core'
          $filename = 'MirroLeap.HQ.Core_v3_x64.zip'
          New-Item -ItemType Directory -Force $archiveDir | Out-Null
          $zip = Join-Path $archiveDir $filename
          Compress-Archive -LiteralPath $coreDir -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Optional HQ runtime ZIP not produced' }
          Add-Type -AssemblyName System.IO.Compression
          $input = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $names = @($input.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('scrcpy-hq-bin/scrcpy.exe','scrcpy-hq-bin/adb.exe','scrcpy-hq-bin/scrcpy-server')) {
              if ($names -notcontains $required) { throw "Optional HQ ZIP missing $required" }
            }
          } finally { $input.Dispose() }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$filename"
          Add-Content -Path $env:GITHUB_ENV -Value "MIRROLEAP_HQ_CORE_SHA256=$sha"
          Add-Content -Path $env:GITHUB_ENV -Value "MIRROLEAP_HQ_CORE_URL=$url"
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Optional HQ ZIP staged as a SEPARATE $mb MiB release asset; SHA256 baked into the app"
      - name: Verify optional HQ ZIP auth and archive guards in Windows Rust
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_runtime::tests
          if ($LASTEXITCODE -ne 0) { throw 'Optional HQ downloader must pass strict SHA256/path gating' }
      - name: Build normal MirroLeap executable with original identity
        run: npm run tauri build -- --no-bundle
      - name: Stage original MirroLeap portable launcher
        shell: pwsh
        run: ./scripts/windows-stage-portable.ps1
      - name: Verify REAL Windows WebView2 main window is not blank
        shell: pwsh
        run: ./scripts/windows-smoke-webview.ps1
      - name: Windows click ripple real desktop COMPOSITOR pixel smoke
        shell: pwsh
        env:
          MIRROLEAP_CLICK_VISUAL_SMOKE: '1'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_click_effect::tests::layered_click_is_visible_in_real_desktop_capture -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native click ripple did not appear in an actual composited Windows desktop capture' }
      - name: Real HQ circle composited above an actively re-stacked topmost SDL-like HWND
        shell: pwsh
        env:
          MIRROLEAP_HQ_COMPOSITOR_SMOKE: '1'
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib hq_cpu_lens_windows::tests::hq_circular_window_is_visible_over_restacked_phone_topmost_hwnd -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            throw 'HQ BGRA was accepted but the circle was invisible above the native phone video'
          }
      - name: Build original-identity LIGHTWEIGHT MirroLeap EXE and MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build
      - name: Stage and verify MirroLeap EXE, MSI, Portable and optional HQ core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          $msis = @(Get-ChildItem src-tauri/target/release/bundle/msi -Filter '*.msi' -File)
          # v5.2.3 EXE was 4.92 MB. Keep this in the same ~5 MB class:
          # patched scrcpy/FFmpeg/SDL are always separate optional assets.
          if ($exes.Count -eq 1 -and $exes[0].Length -gt 9000000) {
            throw 'Lightweight EXE exceeds 9 MB: HQ runtime leaked into installer'
          }
          if ($msis.Count -eq 1 -and $msis[0].Length -gt 12000000) {
            throw 'Lightweight MSI exceeds 12 MB: HQ runtime leaked into installer'
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($config.productName -ne 'MirroLeap' -or $config.identifier -ne 'com.kb.scrcpy-gui-v3') {
            throw 'New installer does NOT match the existing v5.2.3 MirroLeap app identity'
          }
          if ($config.version -ne $version) {throw 'MirroLeap Tauri and NPM package versions differ'}
          if ($config.bundle.resources) {
            throw 'HQ binaries must remain OPTIONAL and may not inflate the MirroLeap installer'
          }
          if ($exes.Count -ne 1 -or $msis.Count -ne 1) {
            throw "Expected exactly one original MirroLeap EXE and one MSI, found $($exes.Count) / $($msis.Count)"
          }
          $out = 'mirroleap-release'
          New-Item -ItemType Directory -Force $out | Out-Null
          $core = Get-Item 'hq-optional-core/MirroLeap.HQ.Core_v3_x64.zip'
          if (-not $core -or $core.Length -le 1000000) {
            throw 'Separate verified HQ runtime asset missing'
          }
          $portableDir='release-portable/MirroLeap-Portable'
          if (-not (Test-Path -LiteralPath "$portableDir/Run-MirroLeap.cmd")) {
            throw 'MirroLeap portable launcher missing'
          }
          $portable=Join-Path $out "MirroLeap_${version}_x64_Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portable -CompressionLevel Optimal
          if ((Get-Item $portable).Length -gt 15000000) {throw 'Portable MirroLeap is unexpectedly heavy'}
          $hashes = @()
          foreach ($artifact in @($exes[0], $msis[0], (Get-Item $portable), $core)) {
            # GitHub Release normalizes spaces in uploaded asset names to dots.
            # Stage using the FINAL published name before hashing so users can
            # run sha256sum -c against their actual downloaded files.
            $publishedName = $artifact.Name.Replace(' ', '.')
            $publishedPath = Join-Path $out $publishedName
            # The portable ZIP is created DIRECTLY in $out; never attempt to
            # Copy-Item an asset onto itself (PowerShell treats this as error).
            if ([IO.Path]::GetFullPath($artifact.FullName) -ine
                [IO.Path]::GetFullPath($publishedPath)) {
              Copy-Item -LiteralPath $artifact.FullName -Destination $publishedPath
            }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $publishedPath).Hash.ToLowerInvariant()
            $hashes += "$hash *$publishedName"
          }
          $hashes | Set-Content -LiteralPath "$out/SHA256SUMS.txt" -Encoding ascii
          foreach ($line in (Get-Content -LiteralPath "$out/SHA256SUMS.txt")) {
            $entry = [regex]::Match($line, '^([0-9a-f]{64}) \*(.+)$')
            if (-not $entry.Success) { throw 'Malformed preview checksum entry' }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out $entry.Groups[2].Value)).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Groups[1].Value) { throw 'MirroLeap release SHA256 checksum verification failed' }
          }
          Copy-Item -LiteralPath 'hq/MIRROLEAP_RELEASE_NOTES.md' -Destination "$out/README_MirroLeap.md"
          Get-ChildItem $out | Select-Object Name, Length
      - name: Sign original MirroLeap NSIS and create canonical vX.Y.Z latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Pinned MirroLeap updater signing key unavailable: refusing unsigned vX.Y.Z release.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v${version}"
          $installer = "mirroleap-release/MirroLeap_${version}_x64-setup.exe"
          $sig = "$installer.sig"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Canonical MirroLeap NSIS installer absent' }
          npm run tauri -- signer sign "$installer"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $sig)) {
            throw 'MirroLeap signer failed; must not publish an unsigned normal version'
          }
          node scripts/verify-updater-signature.mjs "$installer" "$sig"
          if ($LASTEXITCODE -ne 0) { throw 'Normal MirroLeap minisign verification failed' }
          node scripts/write-updater-manifest.mjs "$version" "$installer" "$sig" mirroleap-release/latest.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed normal MirroLeap updater manifest invalid' }
          $latest = Get-Content mirroleap-release/latest.json -Raw | ConvertFrom-Json
          if ($latest.version -ne $version -or
              $latest.platforms.'windows-x86_64'.url -ne "https://github.com/${{ github.repository }}/releases/download/$tag/MirroLeap_${version}_x64-setup.exe") {
            throw 'Signed MirroLeap update URL must exactly match the canonical vX.Y.Z release'
          }
          Write-Host 'PASS same MirroLeap identity and signed vX.Y.Z updater release'
      - uses: actions/upload-artifact@v4
        with:
          name: MirroLeap-Windows-EXE-MSI-Portable-and-OptionalHQ
          if-no-files-found: error
          path: mirroleap-release/*
      - name: Publish original MirroLeap vX.Y.Z prerelease for legacy auto-detection
        if: github.ref == 'refs/heads/feat/mirrocreator-hq-lens-235'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid normal MirroLeap package version' }
          $tag = "v${version}"
          $files = @(Get-ChildItem mirroleap-release -File | ForEach-Object { $_.FullName })
          gh release create $tag $files --repo ${{ github.repository }} `
            --title "MirroLeap v${version} - one app, lightweight installer and optional HQ" `
            --notes-file hq/MIRROLEAP_RELEASE_NOTES.md --prerelease --latest=false `
            --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publish failed' }
