<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live phone frame</title>
  <style>
    /* A transparent, click-through skin: the live scrcpy SDL window remains
       visible and interactive through the empty centre. The Rust side expands
       the real video client by 4% of its width on every edge; pad/Wshell = 4/108.
       CSS vw and native physical pixels therefore agree at every DPI scale. */
    :root {
      --pad: 3.703703704vw;
      --curve: clamp(28px, 7vw, 75px);
      color-scheme: dark;
    }
    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      pointer-events: none !important;
      user-select: none;
      -webkit-user-select: none;
    }
    * { box-sizing: border-box; }
    .body {
      position: absolute;
      inset: 0;
      border: var(--pad) solid #101114;
      border-radius: var(--curve);
      background: transparent;
      box-shadow:
        inset 0 0 0 2px #06070a,
        inset 0 0 13px rgba(0, 0, 0, .65),
        0 0 0 1px rgba(13, 14, 18, .9);
    }
    .metal {
      position: absolute;
      inset: 1px;
      border: clamp(1.5px, .5vw, 4px) solid transparent;
      border-radius: var(--curve);
      background:
        linear-gradient(145deg,#d5d8dc 0%,#737881 13%,#252830 26%,#bdc1c8 46%,#42444b 70%,#e6e8ea 93%)
          border-box;
      /* The mask makes the edge a thin polished metallic ring, no opaque panel. */
      -webkit-mask:
        linear-gradient(#fff 0 0) padding-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .reflection {
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--curve);
    }
    .inner {
      position: absolute;
      inset: var(--pad);
      border-radius: calc(var(--curve) - var(--pad));
      border: clamp(1px, .32vw, 3px) solid #030405;
      box-shadow: 0 0 0 1px rgba(148,153,165,.36),
                  inset 0 0 0 1px rgba(0,0,0,.9);
      /* No background here: video comes from the independent scrcpy window. */
      background: transparent;
    }
    .island {
      position: absolute;
      left: 50%;
      top: calc(var(--pad) + 0.6vw);
      transform: translateX(-50%);
      width: clamp(56px, 23vw, 170px);
      height: clamp(13px, 4vw, 31px);
      background: #050609;
      border: 1px solid rgba(63,65,69,.85);
      border-radius: 9999px;
      box-shadow: inset 0 -1px 3px #15181c, 0 0 0 1px #020304;
    }
    .island::before {
      content: "";
      position: absolute;
      top: 37%;
      right: 12%;
      width: 9%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #203f66 0%, #101927 40%, #070b12 90%);
    }
    .speaker {
      position: absolute;
      top: 42%;
      left: 33%;
      width: 21%;
      height: 15%;
      border-radius: 999px;
      background: #131519;
    }
    .button {
      position: absolute;
      width: clamp(1px, .5vw, 4px);
      background: linear-gradient(90deg,#474c55 0%,#c7cacf 55%,#585d63);
      border-radius: 3px;
      box-shadow: 0 0 2px rgba(0,0,0,.6);
    }
    .mute { left: 0; top: 14%; height: 4%; }
    .vol-up { left: 0; top: 22%; height: 8%; }
    .vol-down { left: 0; top: 32%; height: 8%; }
    .power { right: 0; top: 25%; height: 12%; }
    @media (prefers-reduced-motion: reduce) { *,*::before { animation: none !important; } }
  </style>
</head>
<body aria-hidden="true">
  <div class="body"></div>
  <div class="metal"></div>
  <div class="reflection"></div>
  <div class="inner"></div>
  <div class="island"><div class="speaker"></div></div>
  <div class="button mute"></div>
  <div class="button vol-up"></div>
  <div class="button vol-down"></div>
  <div class="button power"></div>
</body>
</html>
