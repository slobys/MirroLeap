<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ScrcpyGUI - 透明真机外框</title>
  <style>
    /*
     * This entire Tauri window is a pointer-transparent visual overlay. The
     * live screen belongs to the separate scrcpy SDL window beneath us.
     *
     * Do not add fake iPhone status bars, notch, island or an opaque panel.
     * The SVG has a punched-out 964x2114 screen aperture at (18,18) in its
     * 1000x2150 viewBox. src-tauri/src/frame_layout.rs uses those SAME
     * geometric constants, with independent X/Y scaling for Android devices.
     *
     * object-fit: fill intentionally scales the outer vector to match the
     * actual SDL client rect; no cropping or letterbox is allowed.
     */
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      border: 0;
      pointer-events: none !important;
      -webkit-user-select: none;
      user-select: none;
    }
    #device-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      background: transparent;
      pointer-events: none !important;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body aria-hidden="true">
  <img id="device-frame"
       src="/device-frame/iphone-black-portrait.svg"
       alt=""
       draggable="false"
       decoding="sync">
</body>
</html>
