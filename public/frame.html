<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MirroLeap - 透明机身和屏幕标注</title>
  <style>
    /*
     * The live Android picture is always the native scrcpy SDL window below.
     * SVG and ink are drawn inside a transparent WebView2 overlay; no video
     * re-encoding or fake Android status bar is involved.
     *
     * The SVG screen hole is x=18,y=18,w=964,h=2114 in a 1000x2150 viewBox.
     * These independent percentages match src-tauri/src/frame_layout.rs.
     */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      position: fixed; inset: 0; width: 100%; height: 100%;
      margin: 0; padding: 0; overflow: hidden;
      background: transparent !important;
      border: 0; pointer-events: none; user-select: none;
      -webkit-user-select: none;
    }
    #device-frame {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: fill; display: block; pointer-events: none;
      background: transparent; -webkit-user-drag: none;
    }
    #annotation {
      position: absolute;
      left: 1.8%;
      top: .8372093023255814%;
      width: 96.4%;
      height: 98.32558139534883%;
      display: block;
      z-index: 2;
      background: transparent;
      pointer-events: none;
      cursor: crosshair;
      touch-action: none;
    }
    #presentation {
      position: absolute;
      left: 1.8%; top: .8372093023255814%;
      width: 96.4%; height: 98.32558139534883%;
      display: block; z-index: 3; background: transparent;
      /* Presenter darkening and lens MUST remain inside the same rounded
         aperture as the SVG/Win32 video. A square canvas leaks solid dark
         corners over the titanium bezel when the spotlight is enabled. */
      clip-path: inset(0 round 7.46888% / 3.40587%);
      pointer-events: none; touch-action: none; cursor: crosshair;
    }
    /* Landscape is the same black titanium SVG rotated 90 degrees.
       The Canvas hole is now x=18,y=18,w=2114,h=964 in a 2150x1000
       viewBox. Both percentages must match the Rust Win32 layout. */
    html[data-orientation="landscape"] #annotation {
      left: .8372093023255814%;
      top: 1.8%;
      width: 98.32558139534883%;
      height: 96.4%;
    }
    html[data-orientation="landscape"] #presentation {
      left: .8372093023255814%; top: 1.8%;
      width: 98.32558139534883%; height: 96.4%;
      clip-path: inset(0 round 3.40587% / 7.46888%);
    }
    body.inking #annotation { pointer-events: auto; }
    body.presenting #presentation { pointer-events: auto; }
  </style>
</head>
<body aria-hidden="true">
  <img id="device-frame"
       src="/device-frame/iphone-black-portrait.svg"
       alt="" draggable="false" decoding="sync">
  <canvas id="annotation" aria-label="手机投屏标注画布"></canvas>
  <!-- Separate presenter layer. Not included by the ink PNG export. -->
  <canvas id="presentation" aria-label="MirroPresent 聚光灯和定格放大镜"></canvas>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('annotation');
    const ctx = canvas.getContext('2d', { alpha: true });
    const presentCanvas = document.getElementById('presentation');
    const presentCtx = presentCanvas.getContext('2d', { alpha: true });
    let presentationMode = 'off';
    let presentationPoint = {x: .5, y: .5};
    let presentationSnapshot = null;
    let snapshotRequest = 0;
    const presentationModes = new Set(['off', 'spotlight', 'magnifier']);
    let enabled = false;
    let tool = 'pen';
    let color = '#ffd54b';
    let size = 5;
    let drawing = null;
    const strokes = [];
    const bound = value => Math.max(0, Math.min(1, value));
    const currentPoint = event => {
      const r = canvas.getBoundingClientRect();
      return {
        x: bound((event.clientX - r.left) / Math.max(1, r.width)),
        y: bound((event.clientY - r.top) / Math.max(1, r.height))
      };
    };

    // Normalized stroke geometry survives user-driven mirror-window resizing
    // without losing alignment or collecting subpixel errors.
    function renderStroke(stroke) {
      const w = canvas.width, h = canvas.height;
      ctx.save();
      ctx.globalCompositeOperation =
        stroke.tool === 'erase' ? 'destination-out' : 'source-over';
      ctx.strokeStyle = stroke.tool === 'erase' ? '#000' : stroke.color;
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = stroke.size * Math.min(w, h) / 400;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();
      const first = stroke.points[0];
      if (!first) { ctx.restore(); return; }
      ctx.moveTo(first.x * w, first.y * h);
      for (const point of stroke.points.slice(1)) ctx.lineTo(point.x * w, point.y * h);
      if (stroke.points.length === 1) {
        ctx.arc(first.x * w, first.y * h, Math.max(1, ctx.lineWidth / 2), 0, 2 * Math.PI);
        ctx.fill();
      } else {
        ctx.stroke();
      }
      ctx.restore();
    }

    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const stroke of strokes) renderStroke(stroke);
      if (drawing) renderStroke(drawing);
    }

    function fit() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width === width && canvas.height === height) return;
      canvas.width = width;
      canvas.height = height;
      redraw();
    }
    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(canvas);
    fit();

    canvas.addEventListener('pointerdown', event => {
      if (!enabled || event.button !== 0) return;
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      drawing = { tool, color, size: tool === 'erase' ? size * 4 : size, points: [currentPoint(event)] };
      redraw();
    });
    canvas.addEventListener('pointermove', event => {
      if (!enabled || !drawing) return;
      event.preventDefault();
      drawing.points.push(currentPoint(event));
      redraw();
    });
    function finish(event) {
      if (!drawing) return;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      strokes.push(drawing);
      drawing = null;
      redraw();
    }
    canvas.addEventListener('pointerup', finish);
    canvas.addEventListener('pointercancel', finish);

    // Native toolbar controls this API via WebviewWindow.eval(), so the
    // click-through drawing overlay needs no additional Tauri capabilities.
    // Rust detects actual SDL client orientation and asks this same overlay
    // window to swap skins without restarting scrcpy or losing keyboard focus.
    // Pixel/ellipse geometry is handled natively in frame_layout.rs.
    window.scrcpyFrame = Object.freeze({
      setOrientation(orientation) {
        const value = orientation === 'landscape' ? 'landscape' : 'portrait';
        const changed = document.documentElement.dataset.orientation !== value;
        document.documentElement.dataset.orientation = value;
        const asset = '/device-frame/iphone-black-' + value + '.svg';
        const img = document.getElementById('device-frame');
        if (img.getAttribute('src') !== asset) img.setAttribute('src', asset);
        if (changed) {
          // Existing strokes are portrait-normalized and would drift on
          // rotation. Clear them; the native pen can remain enabled.
          drawing = null;
          strokes.length = 0;
          redraw();
          requestAnimationFrame(fit);
        }
        return value;
      },
      current() {
        return document.documentElement.dataset.orientation || 'portrait';
      }
    });

    window.scrcpyInk = Object.freeze({
      // The native control bar must receive an explicit evaluated result before
      // enabling hit-testing. A queued window.eval() by itself is NOT proof
      // that this script was loaded or the canvas really entered ink mode.
      ready: true,
      isEnabled() { return enabled; },
      setEnabled(value) {
        enabled = Boolean(value);
        document.body.classList.toggle('inking', enabled);
        if (!enabled) { drawing = null; redraw(); }
        return enabled;
      },
      setTool(value) { if (value === 'pen' || value === 'erase') tool = value; },
      setColor(value) {
        if (['#ffd54b', '#ff5252', '#ffffff', '#40e0d0'].includes(value)) {
          color = value; tool = 'pen';
        }
      },
      setSize(value) { if ([3, 5, 9].includes(value)) size = value; },
      undo() { if (drawing) drawing = null; else strokes.pop(); redraw(); },
      clear() { drawing = null; strokes.length = 0; redraw(); },
      // Rust invokes this on the SAME overlay instance that displays the pen
      // strokes. Capture the already-rasterized transparent bitmap so the
      // eraser's destination-out effect survives compositing. Never include
      // the separate SVG phone bezel / native hover control window.
      captureSnapshot() {
        if (drawing) throw new Error('Finish drawing before saving the annotated screenshot.');
        if (!strokes.length) throw new Error('There are no pen strokes to export.');
        fit();
        if (canvas.width < 1 || canvas.height < 1 ||
            canvas.width * canvas.height > 16_000_000) {
          throw new Error('Annotation canvas dimensions are not ready.');
        }
        return {
          png: canvas.toDataURL('image/png'),
          orientation: document.documentElement.dataset.orientation || 'portrait',
          strokes: strokes.length
        };
      }
    });
  })();
  </script>
  <script src="/present-overlay.js"></script>
</body>
</html>
