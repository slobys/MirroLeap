<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2150"
     viewBox="0 0 1000 2150" preserveAspectRatio="none" shape-rendering="geometricPrecision" aria-hidden="true">
  <title>Slim black titanium phone bezel, no notch, transparent screen aperture</title>
  <!--
    SOURCE OF TRUTH for src-tauri/src/frame_layout.rs:
    artboard 1000 x 2150; actual video is visible through the unpainted
    x=18,y=18,w=964,h=2114 opening. Preserve this geometry when redesigning.
    The screen's Android contents are never embedded into this asset.
    Portrait only: on landscape the native scrcpy window is shown without skin.
  -->
  <defs>
    <!-- Subtle graphite titanium: avoid the conspicuous silver/dark strips
         which previously looked like an extra exterior outline. -->
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#464c54"/>
      <stop offset=".016" stop-color="#343941"/>
      <stop offset=".12" stop-color="#292e35"/>
      <stop offset=".35" stop-color="#32373f"/>
      <stop offset=".62" stop-color="#292d34"/>
      <stop offset=".87" stop-color="#333942"/>
      <stop offset=".984" stop-color="#353a42"/>
      <stop offset="1" stop-color="#464c54"/>
    </linearGradient>
    <linearGradient id="buttonLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202329"/>
      <stop offset=".43" stop-color="#70757e"/>
      <stop offset=".83" stop-color="#4b5057"/>
      <stop offset="1" stop-color="#1b1e22"/>
    </linearGradient>
    <linearGradient id="buttonRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset=".42" stop-color="#4d5159"/>
      <stop offset=".80" stop-color="#737780"/>
      <stop offset="1" stop-color="#22252a"/>
    </linearGradient>
    <!-- Alpha cutout: the centre is REAL transparency, not a black/white fill.
         This mask also creates the minimal dark rounded corner treatment. -->
    <mask id="transparentScreen" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="2150">
      <rect width="1000" height="2150" fill="#ffffff"/>
      <rect x="18" y="18" width="964" height="2114" rx="72" fill="#000000"/>
    </mask>
  </defs>

  <!-- All body surfaces are clipped *outside* the exact video aperture.
       Never put any element over the top centre of the Android screen. -->
  <g mask="url(#transparentScreen)">
    <!-- The physical silhouette remains x=1...999/rx=76 and the real
         video opening remains x=18...982. Only two contiguous materials:
         one narrow titanium hairline and one continuous dark glass bezel.
         No stacked concentric strokes or alternating black metal bands. -->
    <rect id="phone-titanium-outline" x="1" y="1" width="998" height="2148" rx="76"
          fill="url(#titanium)"/>
    <rect id="phone-glass-bezel" x="3.6" y="3.6" width="992.8" height="2142.8" rx="73.4"
          fill="#0a0c10"/>
  </g>

  <!--
    Seam-free corners require TWO coordinated masks, not a solid rectangle:
      1. SDL's native Win32 mask has 4px *smaller* radii than this SVG aperture,
         so hard native clip pixels remain hidden behind the casing.
      2. This antialiased rounded gasket covers the native hard-edge staircase.
    The independent rectangular corner matte from v4.3.3 has been REMOVED:
    it painted a black rectangle OUTSIDE the rounded handset silhouette.
    Never reintroduce an unrounded opaque rectangle here.
  -->
  <g id="screen-seam-seal" aria-hidden="true">
    <rect id="video-edge-gasket"
          x="18" y="18" width="964" height="2114" rx="72"
          fill="none" stroke="#06080b" stroke-width="6"
          stroke-linejoin="round"/>
  </g>

  <!-- Physical side controls only, never fake status bar / notch / island. -->
  <g aria-hidden="true">
    <rect x=".7" y="328" width="3.4" height="56" rx="1.5"
          fill="url(#buttonLeft)" />
    <rect x=".7" y="454" width="3.4" height="134" rx="1.5"
          fill="url(#buttonLeft)" />
    <rect x=".7" y="632" width="3.4" height="134" rx="1.5"
          fill="url(#buttonLeft)" />
    <rect x="995.9" y="510" width="3.4" height="212" rx="1.5"
          fill="url(#buttonRight)" />
    <path d="M1.6 337v38 M1.6 465v112 M1.6 643v112"
          stroke="#777b83" stroke-opacity=".28" stroke-width=".6" stroke-linecap="round" />
    <path d="M998.3 525v180" stroke="#73777f" stroke-opacity=".24"
          stroke-width=".7" stroke-linecap="round" />
  </g>
</svg>
