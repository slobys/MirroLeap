<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机投屏控制和画笔标注</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden;
      background: transparent !important; color: #e4e7ee;
      -webkit-user-select: none; user-select: none;
    }
    .controls-root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .rail {
      position: absolute; left: 0; top: 0; width: 62px; height: 370px;
      padding: 7px 6px; display: flex; flex-direction: column;
      align-items: center; gap: 4px; overflow: hidden;
      border-radius: 15px; background: rgba(13, 17, 24, .96);
      border: 1px solid rgba(160, 168, 180, .29);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .34), inset 1px 0 rgba(255,255,255,.07);
    }
    body[data-layout="side-left"] .rail,
    body[data-layout="stack-left"] .rail { left: auto; right: 0; }
    button {
      display: grid; place-items: center;
      min-height: 44px; height: 44px; width: 46px; padding: 0;
      background: transparent; color: #c6cbd5;
      border: 0; border-radius: 10px; cursor: pointer;
      touch-action: none; flex: 0 0 auto;
      -webkit-user-select: none; user-select: none;
      transition: background .13s, color .13s;
    }
    button:hover, button:focus-visible {
      background: rgba(116, 133, 166, .3); color: #fff;
      outline: 1px solid rgba(205, 211, 224, .2);
    }
    button:active { background: rgba(155, 175, 200, .4); }
    button.active { background: rgba(40, 177, 157, .35); color: #9af3e5; }
    button.danger:hover { background: rgba(190,55,65,.45); }
    button svg { height: 22px; width: 22px; stroke-width: 1.9; }
    .session-actions, .annotation-actions {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; gap: 4px; flex: 0 0 auto;
    }
    .session-actions {
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(177,188,204,.23);
    }
    .annotation-actions {
      padding-bottom: 4px;
    }
    #restore { color: #83e3d1; }
    #restore:hover { background: rgba(27,148,131,.33); }
    #drag { cursor: grab; }
    #drag:active { cursor: grabbing; }
    /* Separate, non-scrolling flyout. A narrow desktop margin uses stack-*
       and docks this palette beneath the unchanged session-control rail. */
    #ink-tools {
      display: none; position: absolute; top: 10px; left: 68px;
      width: 200px; height: 202px; padding: 9px;
      overflow: hidden; border-radius: 15px;
      background: rgba(13, 17, 24, .97);
      border: 1px solid rgba(160, 168, 180, .32);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      flex-direction: column; gap: 6px;
    }
    body.inking #ink-tools { display: flex; }
    body.quick-open #quick-tools { display: flex; }
    body.present-open #present-tools { display: flex; }
    body[data-layout="side-left"] #ink-tools,
    body[data-layout="side-left"] #quick-tools,
    body[data-layout="side-left"] #present-tools { left: auto; right: 68px; }
    body[data-layout="stack-right"] #ink-tools,
    body[data-layout="stack-left"] #ink-tools {
      width: 168px; height: 202px; top: 376px; left: 0; right: auto; padding: 8px;
    }
    /* A landscape window or a partly off-screen phone may have less than
       270px of vertical space. Preserve large 44px button targets by
       switching the rail from a tall column into TWO short horizontal rows.
       Never add scrolling or hide minimize/close/reset under the taskbar. */
    body[data-layout^="short"] .rail,
    body[data-layout^="tight"] .rail {
      width: 168px; height: 118px; padding: 7px 9px; gap: 4px;
    }
    body[data-layout^="short"] .session-actions,
    body[data-layout^="tight"] .session-actions {
      flex-direction: row; justify-content: space-between;
      gap: 4px; padding-bottom: 3px;
    }
    body[data-layout^="short"] .annotation-actions,
    body[data-layout^="tight"] .annotation-actions {
      flex-direction: row; justify-content: center;
      /* Four 34px mode controls and three 4px gaps fit this 150px rail. */
      gap: 4px; padding-bottom: 0;
    }
    body[data-layout^="short"] .annotation-actions button,
    body[data-layout^="tight"] .annotation-actions button {
      width: 34px; height: 34px; min-height: 34px;
    }
    body[data-layout^="short"] .annotation-actions button svg,
    body[data-layout^="tight"] .annotation-actions button svg {
      width: 18px; height: 18px;
    }
    body[data-layout="short-left"] .rail,
    body[data-layout="short-ink-left"] .rail,
    body[data-layout="tight-ink-left"] .rail { left: auto; right: 0; }
    body[data-layout^="short-ink"] #ink-tools,
    body[data-layout^="tight-ink"] #ink-tools {
      left: 174px; top: 0; width: 200px; height: 202px;
    }
    body[data-layout="short-ink-left"] #ink-tools,
    body[data-layout="tight-ink-left"] #ink-tools {
      left: auto; right: 174px;
    }
    /* Smaller videos still get ALL palette actions simultaneously. A narrow
       condensed palette hides headings, never controls or colors. The native
       code only applies whole-window CSS zoom below this height. */
    body[data-layout^="tight-ink"] #ink-tools { height: 136px; padding: 8px; gap: 6px; }
    body[data-layout^="tight-ink"] #quick-tools { height: 136px; padding: 6px; gap: 4px; }
    body[data-layout^="tight-ink"] .quick-grid button { height: 36px; min-height: 36px; font-size: 10px; gap: 0; }
    body[data-layout^="tight-ink"] .palette-heading { display: none; }
    body[data-layout^="tight-ink"] .palette-actions button,
    body[data-layout^="tight-ink"] #creator-shapes button {
      height: 30px; min-height: 30px;
    }
    body[data-layout^="tight-ink"] .swatches button { height: 26px; min-height: 26px; }
    body[data-layout^="tight-ink"] .sizes button { height: 27px; min-height: 27px; }
    #quick-tools {
      display: none; position: absolute; top: 10px; left: 68px;
      width: 200px; height: 202px; padding: 9px;
      overflow: hidden; border-radius: 15px;
      background: rgba(13,17,24,.97);
      border: 1px solid rgba(160,168,180,.32);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      flex-direction: column; gap: 9px;
    }
    body[data-layout="stack-right"] #quick-tools,
    body[data-layout="stack-left"] #quick-tools {
      width: 168px; height: 202px; top: 376px; left: 0; right: auto;
    }
    body[data-layout^="short-ink"] #quick-tools,
    body[data-layout^="tight-ink"] #quick-tools {
      left: 174px; top: 0; width: 200px; height: 202px;
    }
    body[data-layout="short-ink-left"] #quick-tools,
    body[data-layout="tight-ink-left"] #quick-tools { left:auto; right:174px; }
    /* Must come AFTER the shared short-ink rule. The 136px emergency
       landscape layout cannot use the ordinary 202px popup height. */
    body[data-layout^="tight-ink"] #quick-tools {
      top: 0; height: 136px; padding: 6px; gap: 4px;
    }
    #present-tools {
      display: none; position: absolute; top: 10px; left: 68px;
      width: 200px; height: 202px; padding: 9px;
      border-radius: 15px; overflow: hidden;
      flex-direction: column; gap: 7px;
      background: rgba(13,17,24,.97);
      border: 1px solid rgba(160,168,180,.32);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    body[data-layout="stack-right"] #present-tools,
    body[data-layout="stack-left"] #present-tools {
      width:168px; height:202px; top:376px; left:0; right:auto;
    }
    body[data-layout^="short-ink"] #present-tools,
    body[data-layout^="tight-ink"] #present-tools {
      left:174px; top:0; width:200px; height:202px;
    }
    body[data-layout="side-left"] #present-tools {left:auto;right:68px;}
    body[data-layout="short-ink-left"] #present-tools,
    body[data-layout="tight-ink-left"] #present-tools {left:auto;right:174px;}
    body[data-layout^="tight-ink"] #present-tools {
      top:0; height:136px; padding:6px; gap:4px;
    }
    .present-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
    .present-grid button {
      width:100%;min-width:0;height:51px;min-height:51px;gap:2px;
      font-size:10px;background:rgba(113,129,147,.16);
    }
    #present-live.active,#creator-click.active {background:rgba(18,185,151,.34);color:#a6fff0;}
    .present-grid button svg {width:19px;height:19px;}
    .present-hint {font-size:11px;line-height:16px;color:#98a9bb;}
    body[data-layout^="tight-ink"] .present-grid button {
      height:44px;min-height:44px;font-size:9px;
    }
    body[data-layout^="tight-ink"] .present-hint {display:none;}
    #present-feedback[data-feedback="error"] {color:#fda4af;}
    #present-feedback[data-feedback="sent"] {color:#9fffea;}
    #present-feedback[data-feedback="busy"] {color:#ffd080;}
    .quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
    .quick-grid button { width:100%; height:46px; min-height:46px; gap:1px; font-size:11px;
      background:rgba(113,129,147,.17); }
    .quick-grid button svg { width:18px; height:18px; }
    /* Higher specificity than .quick-grid button keeps the active indicator
       visible after transient feedback ends. */
    .quick-grid button.active {
      background:rgba(18,185,151,.34); color:#a6fff0;
      outline:1px solid rgba(18,185,151,.64);
    }
    #quick-top { position:relative; }
    #quick-top.active::after {
      content:''; position:absolute; top:3px; right:4px;
      width:6px; height:6px; border-radius:50%;
      background:#5ff1c4; box-shadow:0 0 5px #5ff1c4;
    }
    .quick-grid button[data-feedback="busy"] {
      background: rgba(245, 158, 11, .26); color: #ffdb9a;
      outline: 1px solid rgba(245, 158, 11, .7);
    }
    .quick-grid button[data-feedback="sent"] {
      background: rgba(18, 185, 151, .32); color: #9fffea;
      outline: 1px solid rgba(18, 185, 151, .65);
    }
    .quick-grid button[data-feedback="error"] {
      background: rgba(244, 63, 94, .25); color: #ffb4bf;
      outline: 1px solid rgba(244, 63, 94, .7);
    }
    #quick-feedback { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #quick-feedback[data-feedback="busy"] { color: #ffd080; }
    #quick-feedback[data-feedback="sent"] { color: #7ff2d8; }
    #quick-feedback[data-feedback="error"] { color: #fda4af; }
    body[data-layout^="tight-ink"] #quick-feedback {
      display: block; font-size: 10px; line-height: 12px; height: 12px;
    }
    body[data-layout^="tight-ink"] .quick-grid button {
      height: 34px; min-height: 34px; font-size: 10px; gap: 0;
    }
    body[data-layout^="tight-ink"] .quick-grid { gap: 2px; }
    .palette-heading {
      font-size: 11px; line-height: 15px; font-weight: 600; letter-spacing: .04em;
      color: #b7c3d2; flex: none;
    }
    .palette-actions, .swatches, .sizes {
      display: grid; align-items: center; gap: 4px; width: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr)); flex: none;
    }
    .palette-actions button {
      width: 100%; height: 36px; min-height: 36px; border-radius: 9px;
    }
    .palette-actions button svg { width: 20px; height: 20px; }
    .ink-pages { display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%;flex:none; }
    .ink-pages button {width:100%;min-height:23px;height:23px;font-size:11px;
      background:rgba(113,129,147,.17);border-radius:7px;}
    #ink-tools>.palette-heading {display:none;}
    #creator-shapes {display:none;align-items:center;gap:4px;
      grid-template-columns:repeat(4,minmax(0,1fr));width:100%;flex:none;}
    #creator-shapes button {width:100%;height:36px;min-height:36px;font-size:11px;
      background:rgba(113,129,147,.14);}
    body[data-ink-page="creator"] #basic-ink-actions {display:none;}
    body[data-ink-page="creator"] #creator-shapes {display:grid;}
    #ink-privacy-note {display:none;font-size:10px;color:#ffcc75;line-height:13px;}
    body[data-ink-page="creator"] #ink-privacy-note {display:block;}
    body[data-ink-page="creator"] #ink-tools .swatches,
    body[data-ink-page="creator"] #ink-tools .sizes {display:none;}
    .swatches { justify-items: center; }
    .swatches button {
      width: 28px; height: 28px; min-height: 28px;
      border-radius: 50%; border: 2px solid rgba(240, 240, 255, .23);
    }
    .swatches button.selected { outline: 2px solid #fff; outline-offset: 1px; }
    .sizes { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .sizes button {
      font-size: 12px; font-weight: 600; width: 100%; height: 31px; min-height: 31px;
      background: rgba(113,129,147,.14);
    }
    .sizes button.active { background: rgba(40,177,157,.35); color: #9af3e5; }
    /* A visible red warning dot, with full diagnostic in the tooltip.
       Only shown on native/JS activation failures; ordinary use stays tidy. */
    #status {
      display: none; position: absolute; top: 3px; right: 3px;
      width: 11px; height: 11px; padding: 0; overflow: hidden;
      border-radius: 50%; background: #fb7185; z-index: 5;
      border: 2px solid #171a22;
    }
    #status[data-error="true"] { display: block; }
    #ink-toggle[disabled] { opacity: .52; cursor: wait; }
  </style>
</head>
<body data-layout="compact" data-ink-page="basic">
  <div class="controls-root" role="toolbar" aria-label="投屏控制和标注">
  <div class="rail">
    <!-- Window controls always remain adjacent and ABOVE drawing tools. -->
    <div class="session-actions" role="group" aria-label="窗口移动、最小化和关闭">
    <button id="drag" aria-label="按住拖动投屏窗口" title="按住拖动 / Drag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/>
      </svg>
    </button>
    <button id="minimize" aria-label="最小化投屏窗口" title="最小化 / Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 18h14"/>
      </svg>
    </button>
    <button id="close" class="danger" aria-label="关闭投屏窗口" title="关闭 / Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    </div>
    <!-- Quick restore is always available: clear ink AND return phone input. -->
    <div class="annotation-actions" role="group" aria-label="画笔与快速恢复">
    <button id="ink-toggle" aria-label="画笔标注开关" title="画笔标注">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9M15.5 3.5l5 5-12 12H3.5v-5zM14 5l5 5"/>
      </svg>
    </button>


    <button id="quick-toggle" aria-label="手机快捷操作" aria-pressed="false" title="手机快捷操作">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h3m4 0h3M7 15h3m4 0h3"/>
      </svg>
    </button>
    <button id="present-toggle" aria-label="MirroPresent 演示工具" aria-pressed="false" title="聚光灯 / 放大镜">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="7"/><path d="M2 12h3m14 0h3M12 2v3m0 14v3"/>
      </svg>
    </button>
    <button id="restore" aria-label="一键恢复原始画面和手机触控" title="一键恢复画面和手机触控">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11a9 9 0 1 1 2.6 6.4M3 4v7h7"/>
      </svg>
    </button>
    </div>
  </div>

    <div id="ink-tools" role="group" aria-label="画笔工具">
      <div class="ink-pages" role="group" aria-label="标注工具分类">
        <button id="ink-basic-tab" class="active" aria-pressed="true" title="画笔、橡皮和撤销">基础画笔</button>
        <button id="ink-creator-tab" aria-pressed="false" title="箭头、矩形、步骤和遮挡">创作者</button>
      </div>
      <div class="palette-actions" id="basic-ink-actions">
      <button id="pen" aria-label="画笔" aria-pressed="true" class="active" title="画笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9M15.5 3.5l5 5-12 12H3.5v-5zM14 5l5 5"/>
        </svg>
      </button>
      <button id="eraser" aria-label="橡皮擦" aria-pressed="false" title="橡皮擦">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m20 8-5-5a3 3 0 0 0-4.2 0l-8 8a3 3 0 0 0 0 4.2L8 20h4l8-8a3 3 0 0 0 0-4zM7 9l8 8M12 20h9"/>
        </svg>
      </button>
      <button id="undo" aria-label="撤销上一笔" title="撤销上一笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10h12a6 6 0 0 1 0 12h-2M3 10l6-6M3 10l6 6"/>
        </svg>
      </button>
      <button id="clear" aria-label="只清空所有笔迹，保留画笔模式" title="清空笔迹">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>
        </svg>
      </button>
      </div>
      <div id="creator-shapes" role="group" aria-label="MirroCreator 步骤标注与视觉遮挡">
        <button id="creator-arrow" aria-pressed="false" aria-label="箭头标注" title="拖动画箭头">➤</button>
        <button id="creator-rect" aria-pressed="false" aria-label="矩形标注" title="拖动框选重点">▢</button>
        <button id="creator-step" aria-pressed="false" aria-label="步骤编号" title="点击放置 1 到 9 的步骤编号">①</button>
        <button id="creator-mask" aria-pressed="false" aria-label="隐私遮挡" title="仅覆盖演示图层，原始录屏和 OBS 单窗口采集可能没有遮挡">▦</button>
      </div>
      <div id="ink-privacy-note" role="note">注意：遮挡只在演示图层可见，原始录屏/OBS 可能泄露信息！</div>
      <div class="palette-heading">颜色</div>
      <div class="swatches" aria-label="画笔颜色">
        <button id="yellow" class="selected" aria-label="黄色" title="黄色" style="background:#ffd54b"></button>
        <button id="red" aria-label="红色" title="红色" style="background:#ff5252"></button>
        <button id="white" aria-label="白色" title="白色" style="background:#fff"></button>
        <button id="cyan" aria-label="青色" title="青色" style="background:#40e0d0"></button>
      </div>
      <div class="palette-heading">笔触粗细</div>
      <div class="sizes" aria-label="画笔粗细">
        <button id="size-3" aria-label="细笔 3 像素" aria-pressed="false" title="细笔 3px">细</button>
        <button id="size-5" class="active" aria-label="中笔 5 像素" aria-pressed="true" title="中笔 5px">中</button>
        <button id="size-9" aria-label="粗笔 9 像素" aria-pressed="false" title="粗笔 9px">粗</button>
      </div>
    </div>
    <div id="quick-tools" role="group" aria-label="手机快捷操作">
      <div id="quick-feedback" class="palette-heading" role="status" aria-live="polite">快捷操作 · 手机</div>
      <div class="quick-grid">
        <button id="quick-fullscreen" aria-label="全屏" title="切换 scrcpy 全屏 (Alt+F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>全屏
        </button>
        <button id="quick-home" aria-label="手机主页" title="返回手机主页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg>主页
        </button>
        <button id="quick-back" aria-label="手机返回" title="返回上一页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 5-7 7 7 7"/></svg>返回
        </button>
        <button id="quick-recents" aria-label="最近任务" title="查看最近任务">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="12" height="16" rx="2"/><path d="M19 7v10"/></svg>最近任务
        </button>
        <button id="quick-power" aria-label="电源键" title="手机电源键：切换亮屏/息屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v9m-5-6a9 9 0 1 0 10 0"/></svg>电源
        </button>
        <button id="quick-rotate" aria-label="旋转画面" title="请求 Android 真正切换横竖屏（临时固定方向，正常停止投屏时恢复原来的旋转设置）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 3a9 9 0 1 1-11 2M17 3v6h-6"/></svg>旋转
        </button>
        <button id="quick-paste" aria-label="粘贴" title="粘贴电脑剪贴板文本 (Alt+V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 10h6M9 14h6"/></svg>粘贴
        </button>
        <button id="quick-top" aria-label="窗口置顶" aria-pressed="false" title="实时置顶 · 无需重新投屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 21V5m-6 6 6-6 6 6M4 3h16"/></svg><span id="quick-top-label">置顶</span>
        </button>
        <button id="quick-remember" aria-label="记住窗口位置" aria-pressed="true" title="下次投屏恢复本次窗口位置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M7 3v4m10-4v4M7 12h10m-5-2v7"/></svg>记住位置
        </button>
      </div>
    </div>
    <div id="present-tools" role="group" aria-label="MirroPresent 演示工具">
      <div id="present-feedback" class="palette-heading" role="status" aria-live="polite">MirroPresent 演示</div>
      <div class="present-grid">
        <button id="present-spotlight" aria-pressed="false" aria-label="聚光灯" title="聚光灯 · 画面内滚轮调大小">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>聚光灯
        </button>
        <button id="present-magnifier" aria-pressed="false" aria-label="定格放大镜" title="自动读取手机静态截图 · 滚轮调大小">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="6"/><path d="m14 14 7 7M8 10h4m-2-2v4"/></svg>放大镜
        </button>
        <button id="present-live" aria-pressed="false" aria-label="连续实时放大" title="持续读取 Android 新画面，可直接点击、滑动手机；低帧率，可能占用性能">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M7 10h6M10 7v6M18 3v5"/></svg>实时放大
        </button>
        <button id="creator-click" aria-pressed="false" aria-label="点击特效" title="显示电脑鼠标点击位置，不阻挡手机触控">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v5m0 12v5M1 12h5m12 0h5"/></svg>点击特效
        </button>
        <button id="present-refresh" aria-label="刷新定格截图" title="重新读取手机静态截图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7v6h-6M4 17v-6h6M6 9a7 7 0 0 1 12-2M18 15a7 7 0 0 1-12 2"/></svg>刷新截图
        </button>
        <button id="present-off" aria-label="退出演示" title="退出演示并恢复手机触控">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8M16 8l-8 8"/></svg>退出演示
        </button>
      </div>
      <div class="present-hint" id="present-hint">实时放大可正常点击手机；定格放大和聚光灯暂停触控</div>
    </div>
  </div>
  <div id="status" role="status" aria-live="assertive" title=""></div>
  <script>
    (() => {
      'use strict';
      const invoke = action => {
        const handler = window.__TAURI__?.core?.invoke;
        if (!handler) return Promise.reject(new Error('Native controls unavailable'));
        return handler('device_frame_control', { action });
      };
      const status = document.getElementById('status');
      const inkButton = document.getElementById('ink-toggle');
      const quickButton = document.getElementById('quick-toggle');
      const presenterButton = document.getElementById('present-toggle');
      const presenterFeedback = document.getElementById('present-feedback');
      const quickFeedback = document.getElementById('quick-feedback');
      let enabled = false;
      let switching = false;
      let quickSwitching = false;
      let presenterSwitching = false;
      let topSwitching = false;
      let topSyncSequence = 0;
      let pinned = false;
      let presenterTimer = null;
      function presentFeedback(state, message) {
        if (presenterTimer !== null) clearTimeout(presenterTimer);
        presenterFeedback.textContent = message;
        presenterFeedback.title = message;
        presenterFeedback.dataset.feedback = state;
        presenterTimer = setTimeout(() => {
          delete presenterFeedback.dataset.feedback;
          presenterFeedback.textContent = 'MirroPresent 演示';
          presenterFeedback.title = '';
          presenterTimer = null;
        }, state === 'error' ? 5500 : 2800);
      }
      function displayPresentState(open, spotlight, magnifier, live = false) {
        document.body.classList.toggle('present-open', !!open);
        presenterButton.classList.toggle('active', !!open);
        presenterButton.setAttribute('aria-pressed', String(!!open));
        for (const name of ['spotlight','magnifier','live']) {
          const pressed = !!open && (name === 'spotlight' ? spotlight :
            name === 'magnifier' ? magnifier : live);
          const button = document.getElementById('present-' + name);
          button.classList.toggle('active', pressed);
          button.setAttribute('aria-pressed', String(pressed));
        }
        document.getElementById('present-refresh').disabled = !open || !magnifier;
        document.getElementById('present-hint').textContent = live
          ? '实时采样中 · 可以直接点击和滑动手机'
          : '实时模式可操作手机；定格和聚光灯暂停触控';
      }
      async function syncPresentState() {
        if (presenterSwitching) return;
        try {
          const open = await invoke('present_status');
          if (!open) { displayPresentState(false, false, false, false); return; }
          const [spotlight, magnifier, live, click] = await Promise.all([
            invoke('present_is_spotlight'), invoke('present_is_magnifier'),
            invoke('present_is_live'), invoke('creator_click_status'),
          ]);
          displayPresentState(true, spotlight, magnifier, live);
          const button=document.getElementById('creator-click');
          button.classList.toggle('active',!!click);
          button.setAttribute('aria-pressed',String(!!click));
        } catch (error) { report(error); }
      }
      let feedbackTimer = null;
      function actionFeedback(button, state, message) {
        if (feedbackTimer !== null) clearTimeout(feedbackTimer);
        const previous = document.querySelectorAll('.quick-grid button[data-feedback]');
        previous.forEach(item => delete item.dataset.feedback);
        button.dataset.feedback = state;
        quickFeedback.dataset.feedback = state;
        quickFeedback.textContent = message;
        quickFeedback.title = message;
        feedbackTimer = setTimeout(() => {
          delete button.dataset.feedback;
          delete quickFeedback.dataset.feedback;
          quickFeedback.textContent = pinned ? '已置顶 · 点击可取消' : '普通窗口 · 点击可置顶';
          quickFeedback.title = '';
          feedbackTimer = null;
        }, state === 'error' ? 6000 : 3500);
      }

      function displayQuickState(open) {
        const expanded = Boolean(open);
        document.body.classList.toggle('quick-open', expanded);
        quickButton.classList.toggle('active', expanded);
        quickButton.setAttribute('aria-pressed', String(expanded));
      }
      function displayTopState(value) {
        pinned = !!value;
        const button = document.getElementById('quick-top');
        button.classList.toggle('active', pinned);
        button.setAttribute('aria-pressed', String(pinned));
        button.setAttribute('aria-label', pinned ? '取消窗口置顶' : '窗口置顶');
        button.title = pinned ? '已置顶 · 点击立即取消（不重启投屏）' :
          '普通窗口 · 点击立即置顶（不重启投屏）';
        document.getElementById('quick-top-label').textContent = pinned ? '已置顶' : '置顶';
        if (feedbackTimer === null) {
          quickFeedback.textContent = pinned ? '已置顶 · 点击可取消' : '普通窗口 · 点击可置顶';
        }
      }
      async function syncTopState() {
        if (topSwitching || !document.body.classList.contains('quick-open')) return;
        const sequence = ++topSyncSequence;
        try {
          const active = await invoke('quick_top_status');
          // Ignore stale responses that could overwrite a newer user click.
          if (!topSwitching && sequence === topSyncSequence) displayTopState(active);
        } catch(error) { report(error); }
      }
      async function syncRememberState() {
        try {
          const enabled = !!(await invoke('quick_remember_status'));
          const button = document.getElementById('quick-remember');
          button.classList.toggle('active', enabled);
          button.setAttribute('aria-pressed', String(enabled));
        } catch(error) { report(error); }
      }
      async function syncQuickState() {
        if (quickSwitching) return;
        try {
          displayQuickState(await invoke('quick_status'));
        } catch (error) {
          report(error);
        }
      }

      // The native process is the single source of truth. Previously this
      // HTML toggled an independent boolean even when WebView2 had not loaded
      // the drawing script. The button could look green but not actually draw.
      function displayInkState(value) {
        enabled = Boolean(value);
        document.body.classList.toggle('inking', enabled);
        inkButton.classList.toggle('active', enabled);
        inkButton.setAttribute('aria-pressed', String(enabled));
        inkButton.title = enabled
          ? '退出画笔'
          : '开启画笔';
      }

      function report(error, showDialog = false) {
        const message = String(error);
        status.textContent = message;
        status.title = message;
        status.dataset.error = 'true';
        console.error('[MirroLeap Ink]', message);
        if (showDialog) window.alert('画笔暂时无法启用：\n' + message);
      }
      function clearReport() {
        status.textContent = '';
        status.title = '';
        delete status.dataset.error;
      }

      async function syncInkState() {
        if (switching) return;
        try {
          displayInkState(await invoke('ink_status'));
        } catch (error) {
          report(error);
        }
      }

      // Native placement chooses the side or vertically docked palette.
      // Only allow known styles; the controller is never a navigable page.
      window.scrcpyControls = Object.freeze({
        setLayout(layout, zoomPercent = 100) {
          if ([
            'compact', 'side-right', 'side-left', 'stack-right', 'stack-left',
            'short-right', 'short-left', 'short-ink-right', 'short-ink-left',
            'tight-ink-right', 'tight-ink-left'
          ].includes(layout)) {
            document.body.dataset.layout = layout;
            // Match WebView pixel content to the *physical* scaled HWND.
            // Shrinking HWND without zoom would clip buttons at screen edges.
            const percent = Number(zoomPercent);
            if (Number.isFinite(percent) && percent >= 1 && percent <= 100) {
              document.documentElement.style.zoom = String(percent / 100);
            }
          }
        },
        sync() {
          void syncInkState();
          void syncQuickState();
          void syncTopState();
          void syncRememberState();
          void syncPresentState();
        },
      });

      function chooseTool(which) {
        for (const [name,tool] of [
          ['pen','pen'],['eraser','eraser'],
          ['creator-arrow','arrow'],['creator-rect','rect'],
          ['creator-step','step'],['creator-mask','mask']
        ]) {
          const button=document.getElementById(name);
          const active=tool===which;
          button.classList.toggle('active',active);
          button.setAttribute('aria-pressed',String(active));
        }
        document.body.dataset.inkTool=which;
      }
      function setInkPage(page) {
        if (!['basic','creator'].includes(page)) return;
        document.body.dataset.inkPage=page;
        document.getElementById('ink-basic-tab').classList.toggle('active',page==='basic');
        document.getElementById('ink-creator-tab').classList.toggle('active',page==='creator');
        document.getElementById('ink-basic-tab').setAttribute('aria-pressed',String(page==='basic'));
        document.getElementById('ink-creator-tab').setAttribute('aria-pressed',String(page==='creator'));
      }

      async function act(action, success) {
        try {
          const result = await invoke(action);
          clearReport();
          if (action.startsWith('ink_')) displayInkState(result);
          if (success) success();
          return result;
        } catch (error) {
          report(error);
          return null;
        }
      }

      inkButton.addEventListener('click', async () => {
        if (switching) return;
        switching = true;
        inkButton.disabled = true;
        inkButton.setAttribute('aria-busy', 'true');
        try {
          // Acknowledge the ACTUAL JS canvas enabled state, and native hit-test
          // state, before changing the palette. Repeated clicks cannot race.
          const actual = await invoke('ink_toggle');
          clearReport();
          displayInkState(actual);
        } catch (error) {
          report(error, true);
          // The native mode may have been reset on navigation or lost focus.
          // Do not optimistically flip the tool button on failure.
        } finally {
          inkButton.disabled = false;
          inkButton.removeAttribute('aria-busy');
          switching = false;
          await syncInkState();
          await syncQuickState();
          await syncPresentState();
        }
      });

      quickButton.addEventListener('click', async () => {
        if (switching || quickSwitching) return;
        quickSwitching = true;
        quickButton.disabled = true;
        try {
          // Native ACK, not an optimistic local-only toggle.
          displayQuickState(await invoke('quick_toggle'));
          clearReport();
        } catch (error) {
          report(error);
        } finally {
          quickSwitching = false;
          quickButton.disabled = false;
          await syncQuickState();
          await syncTopState();
          await syncInkState();
          await syncPresentState();
        }
      });
      presenterButton.addEventListener('click', async () => {
        if (switching || quickSwitching || presenterSwitching) return;
        presenterSwitching = true;
        presenterButton.disabled = true;
        presentFeedback('busy', '正在打开演示工具…');
        try {
          const opened = await invoke('present_toggle');
          displayPresentState(opened, false, false, false);
          presentFeedback('sent', opened ? '已打开 · 滚轮调圆圈大小' : '已退出演示并恢复触控');
          clearReport();
        } catch (error) {
          report(error);
          presentFeedback('error', '演示工具失败 · ' + String(error));
        } finally {
          presenterSwitching = false;
          presenterButton.disabled = false;
          await syncPresentState();
          await syncQuickState();
          await syncInkState();
        }
      });
      const presentLabels = Object.freeze({
        spotlight: '聚光灯', magnifier: '定格放大镜', live:'实时放大',
        refresh: '刷新截图', off: '退出演示',
      });
      for (const action of ['spotlight','magnifier','live','refresh','off']) {
        const button = document.getElementById('present-' + action);
        button.addEventListener('click', async () => {
          if (!document.body.classList.contains('present-open') || presenterSwitching) return;
          presenterSwitching = true;
          button.disabled = true;
          button.setAttribute('aria-busy', 'true');
          presentFeedback('busy', '正在操作：' + presentLabels[action]);
          try {
            await invoke('present_' + action);
            clearReport();
            presentFeedback('sent', action === 'off' ?
              '演示已退出，手机触控恢复' :
              presentLabels[action] + '已就绪 · 滚轮缩放');
          } catch (error) {
            report(error);
            presentFeedback('error', presentLabels[action] + '失败 · ' + String(error));
          } finally {
            presenterSwitching = false;
            button.removeAttribute('aria-busy');
            button.disabled = false;
            await syncPresentState();
          }
        });
      }
      document.getElementById('creator-click').addEventListener('click',async ()=>{
        const button=document.getElementById('creator-click');
        if (presenterSwitching || !document.body.classList.contains('present-open')) return;
        presenterSwitching=true; button.disabled=true;
        try {
          const active=await invoke('creator_click_toggle');
          button.classList.toggle('active',active);
          button.setAttribute('aria-pressed',String(active));
          presentFeedback('sent',active ? '点击光圈已开启 · 手机中心会显示预览' : '已关闭点击光圈');
        } catch(error) {
          report(error);
          presentFeedback('error','点击特效未开启 · '+String(error));
        } finally {
          button.disabled=false;
          presenterSwitching=false;
          await syncPresentState();
        }
      });
      document.getElementById('quick-top').addEventListener('click', async () => {
        const button=document.getElementById('quick-top');
        if (topSwitching || button.disabled || !document.body.classList.contains('quick-open')) return;
        topSwitching = true;
        topSyncSequence++;
        button.disabled=true;
        button.setAttribute('aria-busy','true');
        actionFeedback(button,'busy','正在实时切换窗口置顶…');
        try {
          // Rust returns success only if SDL, bezel and toolbar all confirm.
          const top=await invoke('quick_top_toggle');
          displayTopState(top);
          clearReport();
          actionFeedback(button,'sent',top ?
            '已置顶 · 手机投屏没有中断' :
            '已取消置顶 · 手机投屏没有中断');
        } catch(error) {
          report(error);
          actionFeedback(button,'error','实时置顶失败 · '+String(error));
        } finally {
          topSwitching = false;
          button.disabled = false;
          button.removeAttribute('aria-busy');
          await syncTopState();
        }
      });
      document.getElementById('quick-remember').addEventListener('click', async () => {
        const button = document.getElementById('quick-remember');
        if (button.disabled || !document.body.classList.contains('quick-open')) return;
        button.disabled = true;
        actionFeedback(button, 'busy', '正在调整窗口位置记忆…');
        try {
          const enabled = !!(await invoke('quick_remember_toggle'));
          button.classList.toggle('active', enabled);
          button.setAttribute('aria-pressed', String(enabled));
          actionFeedback(button, 'sent', enabled ? '已开启 · 下次记住窗口位置' : '已关闭窗口位置记忆');
          clearReport();
        } catch(error) {
          report(error);
          actionFeedback(button, 'error', '记住位置失败 · ' + String(error));
        } finally { button.disabled = false; }
      });
      const quickLabels = Object.freeze({
        fullscreen: '全屏', home: '主页', back: '返回', recents: '最近任务',
        power: '电源键', rotate: '旋转', paste: '粘贴',
      });
      for (const action of ['fullscreen','home','back','recents','power','rotate','paste']) {
        const button = document.getElementById('quick-' + action);
        button.addEventListener('click', async () => {
          if (button.disabled || !document.body.classList.contains('quick-open')) return;
          button.disabled = true;
          button.setAttribute('aria-busy','true');
          actionFeedback(button,'busy',action === 'rotate' ? '正在请求 Android 切换方向…' : '正在发送：'+quickLabels[action]);
          try {
            await invoke('quick_' + action);
            clearReport();
            actionFeedback(button,'sent',action === 'rotate' ? '已确认 Android 画面方向切换' : '指令已发送：'+quickLabels[action]);
          } catch (error) {
            report(error);
            actionFeedback(button,'error',quickLabels[action]+'失败 · '+String(error));
          } finally {
            button.disabled = false;
            button.removeAttribute('aria-busy');
          }
        });
      }

      document.getElementById('drag').addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        void act('drag');
      });
      document.getElementById('minimize').addEventListener('click', () => void act('minimize'));
      document.getElementById('close').addEventListener('click', () => void act('close'));

      document.getElementById('ink-basic-tab').addEventListener('click',()=>{
        void act('ink_pen',()=>{setInkPage('basic');chooseTool('pen');});
      });
      document.getElementById('ink-creator-tab').addEventListener('click',()=>{
        void act('ink_arrow',()=>{setInkPage('creator');chooseTool('arrow');});
      });
      let maskWarningShown=false;
      for (const [name,tool] of [
        ['arrow','arrow'],['rect','rect'],['step','step'],['mask','mask']
      ]) {
        document.getElementById('creator-'+name).addEventListener('click',()=>{
          void act('ink_'+name,()=>{
            setInkPage('creator');chooseTool(tool);
            if (name==='mask' && !maskWarningShown) {
              maskWarningShown=true;
              window.alert('注意：遮挡只是在投屏表面覆盖一个矩形！scrcpy 原始录制、OBS 单窗口采集可能仍包含未遮挡的敏感内容。请务必检查最终录像。');
            }
          });
        });
      }
      document.getElementById('pen').addEventListener('click', () => {
        void act('ink_pen', () => chooseTool('pen'));
      });
      document.getElementById('eraser').addEventListener('click', () => {
        void act('ink_erase', () => chooseTool('eraser'));
      });
      for (const name of ['yellow', 'red', 'white', 'cyan']) {
        document.getElementById(name).addEventListener('click', () => {
          void act('ink_color_' + name, () => {
            document.querySelectorAll('.swatches button').forEach(el => el.classList.remove('selected'));
            document.getElementById(name).classList.add('selected');
            chooseTool('pen');
          });
        });
      }
      for (const size of [3, 5, 9]) {
        document.getElementById('size-' + size).addEventListener('click', () => {
          void act('ink_size_' + size, () => {
            for (const candidate of [3, 5, 9]) {
              const button = document.getElementById('size-' + candidate);
              const selected = candidate === size;
              button.classList.toggle('active', selected);
              button.setAttribute('aria-pressed', String(selected));
            }
          });
        });
      }
      document.getElementById('undo').addEventListener('click', () => void act('ink_undo'));
      document.getElementById('clear').addEventListener('click', () => void act('ink_clear'));
      document.getElementById('restore').addEventListener('click', () => {
        // Single click clears temporary annotations and restores native touch,
        // regardless of whether the pen palette is currently expanded.
        void act('ink_reset', () => {chooseTool('pen');setInkPage('basic');});
      });

      // Recover UI after WebView2 reload, minimize/restore or focus changes.
      // A switch in flight never competes with the following state query.
      window.addEventListener('focus', () => {
        void syncInkState();
        void syncQuickState();
        void syncTopState();
        void syncPresentState();
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          void syncInkState();
          void syncQuickState();
          void syncTopState();
          void syncRememberState();
          void syncPresentState();
        }
      });
      void syncInkState();
      void syncQuickState();
      void syncPresentState();
      void syncTopState();
      void syncRememberState();
    })();
  </script>
</body>
</html>
