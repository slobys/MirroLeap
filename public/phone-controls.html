<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机投屏控制、快捷键与画笔标注</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; padding: 0; margin: 0; overflow: hidden;
      background: transparent !important; color: #e4e7ee;
      -webkit-user-select: none; user-select: none;
    }
    .controls-root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .rail {
      position: absolute; left: 0; top: 0; width: 62px; height: 322px;
      padding: 7px 6px; display: flex; flex-direction: column;
      align-items: center; gap: 4px; overflow: hidden;
      border-radius: 15px; background: rgba(13, 17, 24, .96);
      border: 1px solid rgba(160, 168, 180, .29);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .34), inset 1px 0 rgba(255,255,255,.07);
    }
    body[data-layout="side-left"] .rail,
    body[data-layout="stack-left"] .rail { left: auto; right: 0; }
    button {
      display: grid; place-items: center;
      min-height: 44px; height: 44px; width: 46px; padding: 0;
      background: transparent; color: #c6cbd5;
      border: 0; border-radius: 10px; cursor: pointer;
      touch-action: none; flex: 0 0 auto;
      -webkit-user-select: none; user-select: none;
      transition: background .13s, color .13s;
    }
    button:hover, button:focus-visible {
      background: rgba(116, 133, 166, .3); color: #fff;
      outline: 1px solid rgba(205, 211, 224, .2);
    }
    button:active { background: rgba(155, 175, 200, .4); }
    button.active { background: rgba(40, 177, 157, .35); color: #9af3e5; }
    button.danger:hover { background: rgba(190,55,65,.45); }
    button svg { height: 22px; width: 22px; stroke-width: 1.9; }
    .session-actions, .annotation-actions {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; gap: 4px; flex: 0 0 auto;
    }
    .session-actions {
      padding-bottom: 5px;
      border-bottom: 1px solid rgba(177,188,204,.23);
    }
    .annotation-actions {
      padding-bottom: 4px;
    }
    #restore { color: #83e3d1; }
    #restore:hover { background: rgba(27,148,131,.33); }
    #drag { cursor: grab; }
    #drag:active { cursor: grabbing; }
    /* Separate, non-scrolling flyout. A narrow desktop margin uses stack-*
       and docks this palette beneath the unchanged session-control rail. */
    #ink-tools, #shortcut-tools {
      display: none; position: absolute; top: 10px; left: 68px;
      width: 200px; height: 202px; padding: 9px;
      overflow: hidden; border-radius: 15px;
      background: rgba(13, 17, 24, .97);
      border: 1px solid rgba(160, 168, 180, .32);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
      flex-direction: column; gap: 6px;
    }
    body.inking #ink-tools { display: flex; }
    body.shortcuts #shortcut-tools { display: flex; }
    body[data-layout="side-left"] #ink-tools,
    body[data-layout="side-left"] #shortcut-tools { left: auto; right: 68px; }
    body[data-layout="stack-right"] #ink-tools,
    body[data-layout="stack-left"] #ink-tools,
    body[data-layout="stack-right"] #shortcut-tools,
    body[data-layout="stack-left"] #shortcut-tools {
      width: 168px; height: 202px; top: 328px; left: 0; right: auto; padding: 8px;
    }
    /* A landscape window or a partly off-screen phone may have less than
       270px of vertical space. Preserve large 44px button targets by
       switching the rail from a tall column into TWO short horizontal rows.
       Never add scrolling or hide minimize/close/reset under the taskbar. */
    body[data-layout^="short"] .rail,
    body[data-layout^="tight"] .rail {
      width: 168px; height: 118px; padding: 7px 9px; gap: 4px;
    }
    body[data-layout^="short"] .session-actions,
    body[data-layout^="tight"] .session-actions {
      flex-direction: row; justify-content: space-between;
      gap: 4px; padding-bottom: 3px;
    }
    body[data-layout^="short"] .annotation-actions,
    body[data-layout^="tight"] .annotation-actions {
      flex-direction: row; justify-content: center;
      /* Three buttons must fit the 150-DIP inner rail. */
      gap: 4px; padding-bottom: 0;
    }
    body[data-layout="short-left"] .rail,
    body[data-layout="short-ink-left"] .rail,
    body[data-layout="tight-ink-left"] .rail { left: auto; right: 0; }
    body[data-layout^="short-ink"] #ink-tools,
    body[data-layout^="tight-ink"] #ink-tools,
    body[data-layout^="short-ink"] #shortcut-tools,
    body[data-layout^="tight-ink"] #shortcut-tools {
      left: 174px; top: 0; width: 200px; height: 202px;
    }
    body[data-layout="short-ink-left"] #ink-tools,
    body[data-layout="tight-ink-left"] #ink-tools,
    body[data-layout="short-ink-left"] #shortcut-tools,
    body[data-layout="tight-ink-left"] #shortcut-tools {
      left: auto; right: 174px;
    }
    /* Smaller videos still get ALL palette actions simultaneously. A narrow
       condensed palette hides headings, never controls or colors. The native
       code only applies whole-window CSS zoom below this height. */
    body[data-layout^="tight-ink"] #ink-tools,
    body[data-layout^="tight-ink"] #shortcut-tools { height: 136px; padding: 8px; gap: 6px; }
    body[data-layout^="tight-ink"] .palette-heading { display: none; }
    body[data-layout^="tight-ink"] #shortcut-tools .shortcut-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
    body[data-layout^="tight-ink"] #shortcut-tools .shortcut-grid button {
      height: 42px; min-height: 42px; flex-direction: column; gap: 0;
    }
    body[data-layout^="tight-ink"] #shortcut-tools .shortcut-grid kbd { display: none; }
    body[data-layout^="tight-ink"] .palette-actions button {
      height: 33px; min-height: 33px;
    }
    body[data-layout^="tight-ink"] .swatches button { height: 26px; min-height: 26px; }
    body[data-layout^="tight-ink"] .sizes button { height: 27px; min-height: 27px; }
    .palette-heading {
      font-size: 11px; line-height: 15px; font-weight: 600; letter-spacing: .04em;
      color: #b7c3d2; flex: none;
    }
    .palette-actions, .swatches, .sizes {
      display: grid; align-items: center; gap: 4px; width: 100%;
      grid-template-columns: repeat(4, minmax(0, 1fr)); flex: none;
    }
    .palette-actions button {
      width: 100%; height: 36px; min-height: 36px; border-radius: 9px;
    }
    .palette-actions button svg { width: 20px; height: 20px; }
    .swatches { justify-items: center; }
    .swatches button {
      width: 28px; height: 28px; min-height: 28px;
      border-radius: 50%; border: 2px solid rgba(240, 240, 255, .23);
    }
    .swatches button.selected { outline: 2px solid #fff; outline-offset: 1px; }
    .sizes { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .sizes button {
      font-size: 12px; font-weight: 600; width: 100%; height: 31px; min-height: 31px;
      background: rgba(113,129,147,.14);
    }
    .sizes button.active { background: rgba(40,177,157,.35); color: #9af3e5; }
    .shortcut-grid {
      display: grid; grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 5px; align-items: center; width: 100%;
    }
    .shortcut-grid button {
      display: flex; justify-content: space-between; align-items: center;
      min-width: 0; width: 100%; height: 35px; min-height: 35px;
      padding: 0 7px; gap: 4px; background: rgba(113,129,147,.14);
      font-size: 11px; border-radius: 9px;
    }
    .shortcut-grid kbd {
      display: grid; place-items: center; width: 19px; height: 19px;
      border: 1px solid rgba(160,168,180,.30); border-radius: 5px;
      font-size: 10px; font-family: inherit; color: #c7d2e2;
    }
    #shortcut-toggle[disabled], .shortcut-grid button[disabled] { opacity: .52; cursor: wait; }
    /* A visible red warning dot, with full diagnostic in the tooltip.
       Only shown on native/JS activation failures; ordinary use stays tidy. */
    #status {
      display: none; position: absolute; top: 3px; right: 3px;
      width: 11px; height: 11px; padding: 0; overflow: hidden;
      border-radius: 50%; background: #fb7185; z-index: 5;
      border: 2px solid #171a22;
    }
    #status[data-error="true"] { display: block; }
    #ink-toggle[disabled] { opacity: .52; cursor: wait; }
  </style>
</head>
<body data-layout="compact">
  <div class="controls-root" role="toolbar" aria-label="投屏控制、快捷键和标注">
  <div class="rail">
    <!-- Window controls always remain adjacent and ABOVE drawing tools. -->
    <div class="session-actions" role="group" aria-label="窗口移动、最小化和关闭">
    <button id="drag" aria-label="按住拖动投屏窗口" title="按住拖动 / Drag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/>
      </svg>
    </button>
    <button id="minimize" aria-label="最小化投屏窗口" title="最小化 / Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 18h14"/>
      </svg>
    </button>
    <button id="close" class="danger" aria-label="关闭投屏窗口" title="关闭 / Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    </div>
    <!-- Quick restore is always available: clear ink AND return phone input. -->
    <div class="annotation-actions" role="group" aria-label="画笔、快捷键与快速恢复">
    <button id="ink-toggle" aria-label="画笔标注开关" title="画笔标注">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9M15.5 3.5l5 5-12 12H3.5v-5zM14 5l5 5"/>
      </svg>
    </button>

    <button id="shortcut-toggle" aria-label="展开手机快捷控制" aria-pressed="false" title="手机快捷操作 Alt + 键">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M6 9h1M10 9h1M14 9h1M18 9h1M6 13h1M10 13h1M14 13h1M18 13h1M8 16h8"/>
      </svg>
    </button>
    <button id="restore" aria-label="一键恢复原始画面和手机触控" title="一键恢复画面和手机触控">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11a9 9 0 1 1 2.6 6.4M3 4v7h7"/>
      </svg>
    </button>
    </div>
  </div>

    <div id="ink-tools" role="group" aria-label="画笔工具">
      <div class="palette-heading">画笔操作</div>
      <div class="palette-actions">
      <button id="pen" aria-label="画笔" aria-pressed="true" class="active" title="画笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9M15.5 3.5l5 5-12 12H3.5v-5zM14 5l5 5"/>
        </svg>
      </button>
      <button id="eraser" aria-label="橡皮擦" aria-pressed="false" title="橡皮擦">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m20 8-5-5a3 3 0 0 0-4.2 0l-8 8a3 3 0 0 0 0 4.2L8 20h4l8-8a3 3 0 0 0 0-4zM7 9l8 8M12 20h9"/>
        </svg>
      </button>
      <button id="undo" aria-label="撤销上一笔" title="撤销上一笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10h12a6 6 0 0 1 0 12h-2M3 10l6-6M3 10l6 6"/>
        </svg>
      </button>
      <button id="clear" aria-label="只清空所有笔迹，保留画笔模式" title="清空笔迹">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>
        </svg>
      </button>
      </div>
      <div class="palette-heading">颜色</div>
      <div class="swatches" aria-label="画笔颜色">
        <button id="yellow" class="selected" aria-label="黄色" title="黄色" style="background:#ffd54b"></button>
        <button id="red" aria-label="红色" title="红色" style="background:#ff5252"></button>
        <button id="white" aria-label="白色" title="白色" style="background:#fff"></button>
        <button id="cyan" aria-label="青色" title="青色" style="background:#40e0d0"></button>
      </div>
      <div class="palette-heading">笔触粗细</div>
      <div class="sizes" aria-label="画笔粗细">
        <button id="size-3" aria-label="细笔 3 像素" aria-pressed="false" title="细笔 3px">细</button>
        <button id="size-5" class="active" aria-label="中笔 5 像素" aria-pressed="true" title="中笔 5px">中</button>
        <button id="size-9" aria-label="粗笔 9 像素" aria-pressed="false" title="粗笔 9px">粗</button>
      </div>
    </div>
    <div id="shortcut-tools" role="group" aria-label="手机快捷操作">
      <div class="palette-heading">手机快捷操作 · Alt +</div>
      <div class="shortcut-grid">
        <button id="shortcut-fullscreen" data-shortcut="shortcut_fullscreen" aria-label="全屏 Alt+F"><span>全屏</span><kbd>F</kbd></button>
        <button id="shortcut-home" data-shortcut="shortcut_home" aria-label="主页 Alt+H"><span>主页</span><kbd>H</kbd></button>
        <button id="shortcut-back" data-shortcut="shortcut_back" aria-label="返回 Alt+B"><span>返回</span><kbd>B</kbd></button>
        <button id="shortcut-recents" data-shortcut="shortcut_recents" aria-label="最近任务 Alt+S"><span>最近任务</span><kbd>S</kbd></button>
        <button id="shortcut-power" data-shortcut="shortcut_power" aria-label="电源 Alt+P"><span>电源</span><kbd>P</kbd></button>
        <button id="shortcut-rotate" data-shortcut="shortcut_rotate" aria-label="旋转 Alt+R"><span>旋转</span><kbd>R</kbd></button>
        <button id="shortcut-paste" data-shortcut="shortcut_paste" aria-label="粘贴剪贴板 Alt+V"><span>粘贴</span><kbd>V</kbd></button>
        <button id="shortcut-screen-off" data-shortcut="shortcut_screen_off" aria-label="熄屏 Alt+O"><span>熄屏</span><kbd>O</kbd></button>
      </div>
    </div>
  </div>
  <div id="status" role="status" aria-live="assertive" title=""></div>
  <script>
    (() => {
      'use strict';
      const invoke = action => {
        const handler = window.__TAURI__?.core?.invoke;
        if (!handler) return Promise.reject(new Error('Native controls unavailable'));
        return handler('device_frame_control', { action });
      };
      const status = document.getElementById('status');
      const inkButton = document.getElementById('ink-toggle');
      const shortcutButton = document.getElementById('shortcut-toggle');
      const shortcutActions = Array.from(document.querySelectorAll('.shortcut-grid button'));
      let enabled = false;
      let switching = false;
      let shortcutsOpen = false;
      let shortcutSwitching = false;

      // The native process is the single source of truth. Previously this
      // HTML toggled an independent boolean even when WebView2 had not loaded
      // the drawing script. The button could look green but not actually draw.
      function displayInkState(value) {
        enabled = Boolean(value);
        if (enabled) displayShortcutState(false);
        document.body.classList.toggle('inking', enabled);
        inkButton.classList.toggle('active', enabled);
        inkButton.setAttribute('aria-pressed', String(enabled));
        inkButton.title = enabled
          ? '退出画笔'
          : '开启画笔';
      }

      function displayShortcutState(value) {
        shortcutsOpen = Boolean(value);
        document.body.classList.toggle('shortcuts', shortcutsOpen);
        shortcutButton.classList.toggle('active', shortcutsOpen);
        shortcutButton.setAttribute('aria-pressed', String(shortcutsOpen));
      }

      function report(error, showDialog = false) {
        const message = String(error);
        status.textContent = message;
        status.title = message;
        status.dataset.error = 'true';
        console.error('[MirroLeap Ink]', message);
        if (showDialog) window.alert('画笔暂时无法启用：\n' + message);
      }
      function clearReport() {
        status.textContent = '';
        status.title = '';
        delete status.dataset.error;
      }

      async function syncInkState() {
        if (switching || shortcutSwitching) return;
        try {
          displayInkState(await invoke('ink_status'));
        } catch (error) {
          report(error);
        }
      }
      async function syncShortcutState() {
        if (switching || shortcutSwitching) return;
        try {
          displayShortcutState(await invoke('shortcuts_status'));
        } catch (error) {
          report(error);
        }
      }
      function syncBar() {
        void syncInkState();
        void syncShortcutState();
      }

      // Native placement chooses the side or vertically docked palette.
      // Only allow known styles; the controller is never a navigable page.
      window.scrcpyControls = Object.freeze({
        setLayout(layout, zoomPercent = 100) {
          if ([
            'compact', 'side-right', 'side-left', 'stack-right', 'stack-left',
            'short-right', 'short-left', 'short-ink-right', 'short-ink-left',
            'tight-ink-right', 'tight-ink-left'
          ].includes(layout)) {
            document.body.dataset.layout = layout;
            // Match WebView pixel content to the *physical* scaled HWND.
            // Shrinking HWND without zoom would clip buttons at screen edges.
            const percent = Number(zoomPercent);
            if (Number.isFinite(percent) && percent >= 1 && percent <= 100) {
              document.documentElement.style.zoom = String(percent / 100);
            }
          }
        },
        sync: syncBar,
      });

      function chooseTool(which) {
        for (const name of ['pen', 'eraser']) {
          const button = document.getElementById(name);
          const active = name === which;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        }
      }

      async function act(action, success) {
        try {
          const result = await invoke(action);
          clearReport();
          if (action.startsWith('ink_')) displayInkState(result);
          if (success) success();
          return result;
        } catch (error) {
          report(error);
          return null;
        }
      }

      inkButton.addEventListener('click', async () => {
        if (switching || shortcutSwitching) return;
        switching = true;
        inkButton.disabled = true;
        shortcutButton.disabled = true;
        inkButton.setAttribute('aria-busy', 'true');
        try {
          if (shortcutsOpen) {
            const stillOpen = await invoke('shortcuts_toggle');
            displayShortcutState(stillOpen);
            if (stillOpen) throw new Error('快捷栏尚未关闭');
          }
          // Acknowledge the ACTUAL JS canvas enabled state, and native hit-test
          // state, before changing the palette. Repeated clicks cannot race.
          const actual = await invoke('ink_toggle');
          clearReport();
          displayInkState(actual);
        } catch (error) {
          report(error, true);
          // The native mode may have been reset on navigation or lost focus.
          // Do not optimistically flip the tool button on failure.
        } finally {
          inkButton.disabled = false;
          shortcutButton.disabled = false;
          inkButton.removeAttribute('aria-busy');
          switching = false;
          syncBar();
        }
      });

      shortcutButton.addEventListener('click', async () => {
        if (switching || shortcutSwitching) return;
        shortcutSwitching = true;
        shortcutButton.disabled = true;
        inkButton.disabled = true;
        shortcutButton.setAttribute('aria-busy', 'true');
        try {
          // End drawing without clearing strokes, then open the separate
          // panel. Neither palette may intercept the other palette's input.
          if (enabled) {
            const inkEnabled = await invoke('ink_toggle');
            displayInkState(inkEnabled);
            if (inkEnabled) throw new Error('画笔尚未退出');
          }
          displayShortcutState(await invoke('shortcuts_toggle'));
          clearReport();
        } catch (error) {
          report(error);
        } finally {
          shortcutButton.disabled = false;
          inkButton.disabled = false;
          shortcutButton.removeAttribute('aria-busy');
          shortcutSwitching = false;
          syncBar();
        }
      });

      let sendingShortcut = false;
      for (const button of shortcutActions) {
        button.addEventListener('click', async () => {
          if (!shortcutsOpen || switching || shortcutSwitching || sendingShortcut) return;
          sendingShortcut = true;
          shortcutActions.forEach(item => { item.disabled = true; });
          try {
            // Only literal whitelisted actions may reach device_frame_control.
            // Paste touches the PC clipboard solely after this explicit click.
            await invoke(button.dataset.shortcut);
            clearReport();
          } catch (error) {
            report(error);
          } finally {
            sendingShortcut = false;
            shortcutActions.forEach(item => { item.disabled = false; });
          }
        });
      }

      document.getElementById('drag').addEventListener('pointerdown', event => {
        if (event.button !== 0) return;
        event.preventDefault();
        void act('drag');
      });
      document.getElementById('minimize').addEventListener('click', () => void act('minimize'));
      document.getElementById('close').addEventListener('click', () => void act('close'));

      document.getElementById('pen').addEventListener('click', () => {
        void act('ink_pen', () => chooseTool('pen'));
      });
      document.getElementById('eraser').addEventListener('click', () => {
        void act('ink_erase', () => chooseTool('eraser'));
      });
      for (const name of ['yellow', 'red', 'white', 'cyan']) {
        document.getElementById(name).addEventListener('click', () => {
          void act('ink_color_' + name, () => {
            document.querySelectorAll('.swatches button').forEach(el => el.classList.remove('selected'));
            document.getElementById(name).classList.add('selected');
            chooseTool('pen');
          });
        });
      }
      for (const size of [3, 5, 9]) {
        document.getElementById('size-' + size).addEventListener('click', () => {
          void act('ink_size_' + size, () => {
            for (const candidate of [3, 5, 9]) {
              const button = document.getElementById('size-' + candidate);
              const selected = candidate === size;
              button.classList.toggle('active', selected);
              button.setAttribute('aria-pressed', String(selected));
            }
          });
        });
      }
      document.getElementById('undo').addEventListener('click', () => void act('ink_undo'));
      document.getElementById('clear').addEventListener('click', () => void act('ink_clear'));
      document.getElementById('restore').addEventListener('click', () => {
        // Single click clears temporary annotations and restores native touch,
        // regardless of whether the pen palette is currently expanded.
        void act('ink_reset', () => {
          chooseTool('pen');
          displayShortcutState(false);
        });
      });

      // Recover UI after WebView2 reload, minimize/restore or focus changes.
      // A switch in flight never competes with the following state query.
      window.addEventListener('focus', syncBar);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) syncBar();
      });
      syncBar();
    })();
  </script>
</body>
</html>
