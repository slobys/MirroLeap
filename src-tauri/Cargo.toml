[package]
name = "mirroleap"
version = "5.1.4"
authors = ["slobys", "KB-kil0bit contributors"]
description = "MirroLeap: a lightweight Android mirroring desktop client powered by scrcpy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scrcpy_gui_v3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
zip = "8.1.0"
flate2 = "1.0"
tar = "0.4"
tokio = { version = "1.49.0", features = ["full"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-clipboard-manager = "=2.3.3"
chrono = "0.4.43"
sha2 = "0.10"
base64 = "0.22"
png = "0.17"
# Global OS shortcuts: Ctrl+Alt+Shift+C to recentre the active mirror window
# (all platforms) and Ctrl+Alt+Shift+W to drag the borderless scrcpy window
# with the mouse (Windows-only). See src/shortcuts.rs and src/grab.rs.
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2.4.0"

# Windows-only: read the scrcpy mirror window's client-area position natively
# (EnumWindows + ClientToScreen) to persist it across sessions. Match
# Tauri 2.12's 0.62 HWND types; mixing 0.61 and 0.62 breaks native HWND APIs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
